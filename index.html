<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قطاع الملايكة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --g:#2D6A4F;--gm:#40916C;--gl:#74C69D;--gp:#D8F3DC;--gf:#F0FAF3;
  --am:#E9A919;--ap:#FFF3CD;--rd:#C0392B;--rp:#FDECEA;
  --bl:#2563EB;--bp:#EFF6FF;
  --tx:#1A2E22;--tm:#3D5A47;--mu:#7A9585;--bd:#C8E6D0;--bg:#F4FAF6;
  --r:10px;--sh:0 1px 4px rgba(45,106,79,0.10);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;font-size:15px}
.screen{display:none;min-height:100vh}
.screen.active{display:flex;flex-direction:column}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* LOADING */
#loading-overlay{display:none;position:fixed;inset:0;background:rgba(27,67,50,0.93);z-index:9999;align-items:center;justify-content:center;flex-direction:column;gap:14px}
.spin{width:44px;height:44px;border:4px solid rgba(255,255,255,0.25);border-top-color:#fff;border-radius:50%;animation:spin .75s linear infinite}
.loading-txt{color:#fff;font-size:14px;font-weight:600}

/* LOGIN */
#screen-login{align-items:center;justify-content:center;background:linear-gradient(160deg,#1B4332 0%,#2D6A4F 55%,#40916C 100%);padding:20px}
.login-box{background:#fff;border-radius:20px;padding:36px;width:100%;max-width:440px;box-shadow:0 8px 32px rgba(0,0,0,0.2);animation:fade .3s ease}
.login-logo{text-align:center;margin-bottom:22px}
.logo-ic{width:60px;height:60px;background:var(--gp);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;margin-bottom:10px}
.login-logo h1{font-size:22px;font-weight:700;color:var(--g)}
.login-logo p{font-size:13px;color:var(--mu);margin-top:3px}
.lbl{font-size:13px;font-weight:600;color:var(--tm);margin-bottom:5px;display:block}
.fi{width:100%;padding:10px 13px;border:1.5px solid var(--bd);border-radius:var(--r);font-family:'Cairo',sans-serif;font-size:14px;color:var(--tx);background:#fff;margin-bottom:13px;outline:none}
.fi:focus{border-color:var(--gm)}
.role-tabs{display:flex;gap:8px;margin-bottom:16px}
.rt{flex:1;padding:10px 4px;border:2px solid var(--bd);border-radius:var(--r);background:#fff;font-family:'Cairo',sans-serif;font-size:13px;font-weight:600;cursor:pointer;color:var(--mu);transition:all .15s;text-align:center}
.rt.active{border-color:var(--g);background:var(--gf);color:var(--g)}
.login-btn{width:100%;padding:13px;background:var(--g);color:#fff;border:none;border-radius:var(--r);font-family:'Cairo',sans-serif;font-size:16px;font-weight:700;cursor:pointer;transition:background .15s}
.login-btn:hover{background:var(--gm)}
.login-err{color:var(--rd);font-size:13px;text-align:center;margin-bottom:10px;display:none}

/* HEADER */
.app-header{background:var(--g);color:#fff;padding:0 18px;height:54px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,0.12)}
.hd-title{font-size:15px;font-weight:700}
.hd-sub{font-size:11px;opacity:.75}
.hd-right{display:flex;align-items:center;gap:8px}
.role-bdg{background:rgba(255,255,255,0.2);padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.logout-btn{background:rgba(255,255,255,0.15);border:none;color:#fff;padding:6px 12px;border-radius:20px;font-family:'Cairo',sans-serif;font-size:12px;cursor:pointer}
.bday-banner{background:var(--am);color:#5C3D00;padding:8px 18px;font-size:13px;font-weight:600;display:none;text-align:center}

/* TABS */
.tabs-bar{display:flex;background:#fff;border-bottom:2px solid var(--bd);padding:0 14px;overflow-x:auto;position:sticky;top:54px;z-index:90;scrollbar-width:none}
.tabs-bar::-webkit-scrollbar{display:none}
.tab-btn{padding:12px 13px;font-family:'Cairo',sans-serif;font-size:13px;font-weight:600;border:none;background:none;cursor:pointer;color:var(--mu);white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-2px;transition:all .15s}
.tab-btn.active{color:var(--g);border-bottom-color:var(--g)}
.tab-content{display:none;padding:18px;max-width:960px;margin:0 auto;width:100%}
.tab-content.active{display:block;animation:fade .2s ease}

/* COMMON */
.card{background:#fff;border-radius:14px;box-shadow:var(--sh);padding:18px;margin-bottom:14px;border:1px solid var(--bd)}
.sec-title{font-size:16px;font-weight:700;color:var(--g);margin-bottom:14px;padding-bottom:9px;border-bottom:2px solid var(--gp);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.badge{font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px}
.bg-g{background:var(--gp);color:var(--g)} .bg-a{background:var(--ap);color:#7A5000}
.bg-r{background:var(--rp);color:var(--rd)} .bg-b{background:var(--bp);color:var(--bl)}
.bg-gray{background:#f0f0f0;color:#555}
.empty-state{text-align:center;padding:40px 16px;color:var(--mu);font-size:14px}
.empty-state .ei{font-size:38px;margin-bottom:8px}

/* MEETING */
.meet-card{background:#fff;border-radius:14px;box-shadow:var(--sh);border:1px solid var(--bd);margin-bottom:13px;overflow:hidden}
.meet-hd{background:var(--gf);padding:11px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--bd);flex-wrap:wrap;gap:8px}
.meet-num{font-size:14px;font-weight:700;color:var(--g)}
.meet-date{font-size:12px;color:var(--mu);font-weight:600}
.meet-resp{font-size:11px;background:var(--gp);color:var(--g);padding:3px 10px;border-radius:20px}
.meet-body{padding:12px 16px;display:grid;grid-template-columns:1fr 1fr;gap:9px}
.para-item{padding:9px 12px;border-radius:8px;border:1.5px solid var(--bd);background:var(--bg)}
.para-item.mine{border-color:var(--am);background:var(--ap)}
.para-item.unset{opacity:.7}
.para-lbl{font-size:10px;font-weight:700;color:var(--mu);margin-bottom:2px;text-transform:uppercase}
.para-topic{font-size:12px;color:var(--tm);margin-bottom:3px;font-style:italic}
.para-ldrs{font-size:12px;font-weight:600;color:var(--tx)}
.para-item.mine .para-ldrs{color:#7A5000}

/* CHILDREN */
.child-row{background:#fff;border-radius:12px;box-shadow:var(--sh);border:1px solid var(--bd);padding:13px 15px;margin-bottom:10px}
.child-rh{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px}
.child-name{font-size:14px;font-weight:700}
.child-info{font-size:12px;color:var(--mu);margin-bottom:9px;line-height:1.8}
.st-btns{display:flex;gap:6px;margin-bottom:9px;flex-wrap:wrap}
.st-btn{padding:6px 13px;border-radius:20px;border:1.5px solid var(--bd);background:#fff;font-family:'Cairo',sans-serif;font-size:12px;font-weight:600;cursor:pointer;color:var(--mu);transition:all .15s}
.st-btn.sp{background:var(--gp);border-color:var(--gl);color:var(--g)}
.st-btn.se{background:var(--ap);border-color:var(--am);color:#7A5000}
.st-btn.sa{background:var(--rp);border-color:var(--rd);color:var(--rd)}
.st-btn.sd{background:var(--gp);border-color:var(--gl);color:var(--g)}
.notes{width:100%;padding:7px 11px;border:1.5px solid var(--bd);border-radius:8px;font-family:'Cairo',sans-serif;font-size:13px;color:var(--tx);resize:vertical;min-height:46px;outline:none}
.notes:focus{border-color:var(--gm)}

/* TABLE */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--gf);padding:9px 11px;text-align:right;font-weight:700;color:var(--g);border-bottom:2px solid var(--bd);white-space:nowrap}
td{padding:9px 11px;border-bottom:1px solid var(--bd);vertical-align:middle}
tr:hover td{background:var(--gf)}
.abtns{display:flex;gap:5px;flex-wrap:nowrap}
.ab{padding:4px 11px;border-radius:20px;border:none;font-family:'Cairo',sans-serif;font-size:11px;font-weight:600;cursor:pointer}
.ab-g{background:var(--gp);color:var(--g)} .ab-a{background:var(--ap);color:#7A5000} .ab-r{background:var(--rp);color:var(--rd)}

/* FORM */
.add-form{background:var(--gf);border:1.5px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:18px}
.add-form h3{font-size:13px;font-weight:700;color:var(--g);margin-bottom:12px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.fr3{grid-template-columns:1fr 1fr 1fr}
.fr1{grid-template-columns:1fr}
.fg label{display:block;font-size:11px;font-weight:600;color:var(--tm);margin-bottom:3px}
.fg input,.fg select,.fg textarea{width:100%;padding:8px 11px;border:1.5px solid var(--bd);border-radius:8px;font-family:'Cairo',sans-serif;font-size:13px;color:var(--tx);background:#fff;outline:none}
.fg input:focus,.fg select:focus{border-color:var(--gm)}
.fg select[multiple]{height:90px;padding:4px}
.sv-btn{background:var(--g);color:#fff;border:none;border-radius:8px;padding:9px 20px;font-family:'Cairo',sans-serif;font-size:13px;font-weight:700;cursor:pointer}
.cn-btn{background:#f0f0f0;color:#555;border:none;border-radius:8px;padding:9px 20px;font-family:'Cairo',sans-serif;font-size:13px;cursor:pointer;margin-right:6px}

/* MODAL */
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:500;display:none;align-items:center;justify-content:center;padding:16px}
.modal-ov.open{display:flex}
.modal{background:#fff;border-radius:16px;padding:24px;width:100%;max-width:520px;box-shadow:0 8px 32px rgba(0,0,0,0.2);max-height:90vh;overflow-y:auto;animation:fade .2s ease}
.modal-title{font-size:16px;font-weight:700;color:var(--g);margin-bottom:18px}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}

/* STATS */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:11px;margin-bottom:18px}
.stat-box{background:#fff;border-radius:12px;padding:15px;box-shadow:var(--sh);border:1px solid var(--bd);text-align:center}
.stat-num{font-size:26px;font-weight:700;color:var(--g);line-height:1}
.stat-lbl{font-size:11px;color:var(--mu);margin-top:5px}
.prog{height:6px;border-radius:3px;background:var(--gp);margin-top:6px;overflow:hidden}
.prog-fill{height:100%;border-radius:3px;background:var(--g)}

/* BIRTHDAYS */
.mo-title{font-size:13px;font-weight:700;color:var(--tm);margin-bottom:8px;padding:5px 11px;background:var(--gf);border-radius:8px;display:inline-block}
.bday-item{display:flex;align-items:center;gap:11px;padding:9px 13px;background:#fff;border-radius:10px;margin-bottom:7px;border:1px solid var(--bd);box-shadow:var(--sh)}
.bday-av{width:32px;height:32px;border-radius:50%;background:var(--gp);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--g);flex-shrink:0}
.bday-today{border-color:var(--am);background:var(--ap)}

/* SYNC */
.sync-ind{position:fixed;bottom:14px;left:14px;background:var(--g);color:#fff;padding:7px 14px;border-radius:20px;font-size:11px;font-weight:600;display:none;z-index:999;box-shadow:0 2px 8px rgba(0,0,0,0.2)}
.sync-ind.err{background:var(--rd)}

/* LATT */
.latt-row{background:#fff;border-radius:12px;padding:13px 15px;margin-bottom:9px;border:1px solid var(--bd)}
.latt-name{font-size:14px;font-weight:700;margin-bottom:7px}
.latt-ctrl{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.uni-tog{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--mu)}
.uni-tog input{accent-color:var(--g);width:14px;height:14px}

/* ACT */
.act-card{display:flex;align-items:center;gap:13px;background:#fff;border-radius:12px;padding:13px 15px;margin-bottom:9px;border:1px solid var(--bd);box-shadow:var(--sh)}
.act-icon{width:40px;height:40px;border-radius:9px;background:var(--gp);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}

/* PASS TAB */
.pass-row{display:flex;align-items:center;justify-content:space-between;padding:12px 15px;background:#fff;border-radius:10px;border:1px solid var(--bd);margin-bottom:8px;box-shadow:var(--sh)}
.pass-role{font-size:13px;font-weight:700}
.pass-val{font-size:13px;color:var(--mu);font-family:monospace;background:var(--gf);padding:3px 10px;border-radius:6px}

@media(max-width:600px){
  .meet-body,.fr,.fr3{grid-template-columns:1fr}
  .stats-grid{grid-template-columns:repeat(2,1fr)}
  .tab-btn{padding:11px 9px;font-size:12px}
  .login-box{padding:24px 18px}
}
</style>
</head>
<body>
<div id="sync-ind" class="sync-ind">جاري الحفظ...</div>
<div id="loading-overlay" style="display:none;position:fixed;inset:0;background:rgba(27,67,50,0.93);z-index:9999;align-items:center;justify-content:center;flex-direction:column;gap:14px">
  <div class="spin"></div><div class="loading-txt">جاري تحميل البيانات...</div>
</div>

<!-- MODAL -->
<div class="modal-ov" id="modal-ov">
  <div class="modal">
    <div class="modal-title" id="modal-title"></div>
    <div id="modal-body"></div>
    <div class="modal-footer">
      <button class="cn-btn" onclick="closeModal()">إلغاء</button>
      <button class="sv-btn" id="modal-ok">حفظ</button>
    </div>
  </div>
</div>

<!-- LOGIN -->
<div id="screen-login" class="screen active">
  <div class="login-box">
    <div class="login-logo">
      <div class="logo-ic">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="#2D6A4F"><path d="M17 12h-5v5h5v-5zM16 1v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2h-1V1h-2zm3 18H5V8h14v11z"/></svg>
      </div>
      <h1>قطاع الملايكة</h1>
      <p>نظام إدارة الكشافة</p>
    </div>
    <div class="role-tabs" id="role-tabs-container">
      <button class="rt" onclick="selectRole('assistant')" id="rt-assistant">مساعد قائد</button>
      <button class="rt active" onclick="selectRole('teamleader')" id="rt-teamleader">قائد الفريق</button>
      <button class="rt" onclick="selectRole('admin')" id="rt-admin">قائد القطاع</button>
    </div>
    <div id="lf-leader">
      <label class="lbl">الفصل:</label>
      <select class="fi" id="sel-class">
        <option value="">-- اختار --</option>
        <option value="ملايكة أ">ملايكة أ</option>
        <option value="ملايكة ب">ملايكة ب</option>
      </select>
      <div id="lf-name-wrap">
        <label class="lbl">اسمك:</label>
        <select class="fi" id="sel-leader"><option value="">-- اختار الفصل أولاً --</option></select>
      </div>
    </div>
    <div id="lf-admin" style="display:none"></div>
    <label class="lbl">كلمة السر:</label>
    <input class="fi" type="password" id="login-pass" placeholder="ادخل كلمة السر">
    <p class="login-err" id="login-err">كلمة السر غلط</p>
    <button class="login-btn" onclick="doLogin()">دخول</button>
  </div>
</div>

<!-- APP -->
<div id="screen-app" class="screen">
  <div class="bday-banner" id="bday-banner">🎂 عيد ميلاد سعيد يا <span id="bday-nm"></span>!</div>
  <div class="app-header">
    <div><div class="hd-title" id="hd-title">قطاع الملايكة</div><div class="hd-sub" id="hd-sub"></div></div>
    <div class="hd-right"><span class="role-bdg" id="role-bdg"></span><button class="logout-btn" onclick="doLogout()">خروج</button></div>
  </div>

  <!-- ASSISTANT -->
  <div id="tabs-assistant" style="display:none">
    <div class="tabs-bar">
      <button class="tab-btn active" onclick="showTab('as-plan','assistant')">خطة السنة</button>
      <button class="tab-btn" onclick="showTab('as-followup','assistant')">الافتقاد</button>
      <button class="tab-btn" onclick="showTab('as-activities','assistant')">الأنشطة</button>
      <button class="tab-btn" onclick="showTab('as-attendance','assistant')">التحضير</button>
    </div>
    <div id="tab-as-plan" class="tab-content active"></div>
    <div id="tab-as-followup" class="tab-content"></div>
    <div id="tab-as-activities" class="tab-content"></div>
    <div id="tab-as-attendance" class="tab-content"></div>
  </div>

  <!-- TEAM LEADER -->
  <div id="tabs-teamleader" style="display:none">
    <div class="tabs-bar">
      <button class="tab-btn active" onclick="showTab('tl-plan','teamleader')">توزيع الخطة</button>
      <button class="tab-btn" onclick="showTab('tl-children','teamleader')">الأولاد</button>
      <button class="tab-btn" onclick="showTab('tl-latt','teamleader')">حضور القادة</button>
      <button class="tab-btn" onclick="showTab('tl-catt','teamleader')">حضور الأولاد</button>
      <button class="tab-btn" onclick="showTab('tl-followup','teamleader')">الافتقاد</button>
      <button class="tab-btn" onclick="showTab('tl-activities','teamleader')">الأنشطة</button>
      <button class="tab-btn" onclick="showTab('tl-reports','teamleader')">التقارير</button>
    </div>
    <div id="tab-tl-plan" class="tab-content active"></div>
    <div id="tab-tl-children" class="tab-content"></div>
    <div id="tab-tl-latt" class="tab-content"></div>
    <div id="tab-tl-catt" class="tab-content"></div>
    <div id="tab-tl-followup" class="tab-content"></div>
    <div id="tab-tl-activities" class="tab-content"></div>
    <div id="tab-tl-lvisit" class="tab-content"></div>
    <div id="tab-tl-reports" class="tab-content"></div>
  </div>

  <!-- ADMIN -->
  <div id="tabs-admin" style="display:none">
    <div class="tabs-bar">
      <button class="tab-btn active" onclick="showTab('ad-plan','admin')">خطة الاجتماعات</button>
      <button class="tab-btn" onclick="showTab('ad-children','admin')">الأولاد</button>
      <button class="tab-btn" onclick="showTab('ad-leaders','admin')">القادة</button>
      <button class="tab-btn" onclick="showTab('ad-latt','admin')">حضور القادة</button>
      <button class="tab-btn" onclick="showTab('ad-birthdays','admin')">أعياد الميلاد</button>
      <button class="tab-btn" onclick="showTab('ad-reports','admin')">التقارير</button>
      <button class="tab-btn" onclick="showTab('ad-passwords','admin')">كلمات السر</button>
    </div>
    <div id="tab-ad-plan" class="tab-content active"></div>
    <div id="tab-ad-children" class="tab-content"></div>
    <div id="tab-ad-leaders" class="tab-content"></div>
    <div id="tab-ad-latt" class="tab-content"></div>
    <div id="tab-ad-birthdays" class="tab-content"></div>
    <div id="tab-ad-reports" class="tab-content"></div>
    <div id="tab-ad-passwords" class="tab-content"></div>
  </div>
</div>

<script>

    {id:3,  name:"اندرو مجدى سلامة",           cls:"ملايكة ب",lid:0,phone:"01208514661",addr:"28ش ترعة الجبل",dob:"2019-03-04"},

// =========================================================
// SHEET I/O
// =========================================================
async function sheetGet(sheetName){
  try{
    const r=await fetch(`${AS_URL}?sheet=${encodeURIComponent(sheetName)}`);
    const j=await r.json(); return j.data||[];
  }catch(e){ console.warn("sheetGet",sheetName,e); return []; }
}
async function sheetPost(payload){
  try{
    await fetch(AS_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
    showSync("✓ تم الحفظ في الشيت");
  }catch(e){ showSync("⚠ تعذر الحفظ",true); }
}

async function sheetGetWithRetry(sheetName, retries=3, delay=1500){
  for(let i=0;i<retries;i++){
    try{
      const r=await fetch(`${AS_URL}?sheet=${encodeURIComponent(sheetName)}`);
      if(!r.ok) throw new Error("HTTP "+r.status);
      const j=await r.json();
      if(j.data) return j.data;
      throw new Error("no data key");
    }catch(e){
      console.warn(`sheetGet "${sheetName}" attempt ${i+1} failed:`,e.message);
      if(i<retries-1) await new Promise(res=>setTimeout(res,delay));
    }
  }
  return [];
}

// =========================================================
// LOAD ALL
// =========================================================
function setLoadingText(txt){
  const el=document.querySelector("#loading-overlay .loading-txt");
  if(el) el.textContent=txt;
}

async function loadAll(){
  // Hide login, show loading
  document.getElementById("screen-login").style.visibility="hidden";
  showLoading();
  setLoadingText("جاري تحميل البيانات...");

  let success=false;
  for(let attempt=1;attempt<=3;attempt++){
    try{
      setLoadingText(attempt>1?`إعادة المحاولة... (${attempt}/3)`:"جاري تحميل البيانات...");

      // Fetch all in parallel for speed
      const [ldrs, passes, meets, acts, chSheet] = await Promise.all([
        sheetGetWithRetry("القادة",1),
        sheetGetWithRetry("كلمات السر",1),
        sheetGetWithRetry("خطة الاجتماعات",1),
        sheetGetWithRetry("الأنشطة",1),
        sheetGetWithRetry("توزيع الأولاد",1),
      ]);

      // Leaders — require at least some data to count as success
      DATA.leaders=ldrs.filter(r=>r[0]&&String(r[0]).trim()).map((r,i)=>({
        id:i+1, name:String(r[0]).trim(), cls:String(r[1]||"").trim(),
        phone:String(r[2]||"").trim(), dob:String(r[3]||"").trim()
      }));

      // Passwords
      DATA.passwords=passes.filter(r=>r[0]).map(r=>({
        role:String(r[0]).trim(), cls:String(r[1]||"").trim(), password:String(r[2]||"").trim()
      }));

      // Meetings
      DATA.meetings=meets.filter(r=>r[0]&&r[1]).map((r,i)=>({
        id:i+1, num:parseInt(r[0])||i+1, date:String(r[1]||"").trim(),
        responsible:null,
        paras:{spiritual:{topic:"",leaders:[]},scout:{topic:"",leaders:[]},culture:{topic:"",leaders:[]},game:{topic:"",leaders:[]},other:{topic:"",leaders:[]}}
      }));

      // Activities
      DATA.activities=acts.filter(r=>r[0]).map((r,i)=>({
        id:i+1, name:String(r[0]).trim(), date:String(r[1]||"").trim(), cls:String(r[2]||"").trim()
      }));

      // Children assignments
      chSheet.filter(r=>r[0]&&r[1]).forEach(r=>{
        const ch=DATA.children.find(c=>c.name===String(r[0]).trim());
        if(ch){ const l=DATA.leaders.find(l=>l.name===String(r[1]).trim()); if(l) ch.lid=l.id; }
      });

      success=true;
      break;

    }catch(e){
      console.error(`loadAll attempt ${attempt}:`,e);
      if(attempt<3) await new Promise(res=>setTimeout(res,2000));
    }
  }

  hideLoading();
  document.getElementById("screen-login").style.visibility="visible";

  if(!success){
    // Show retry button on login screen
    showRetryBanner();
  }
}

function showRetryBanner(){
  const box=document.querySelector(".login-box");
  const existing=document.getElementById("retry-banner");
  if(existing) existing.remove();
  const div=document.createElement("div");
  div.id="retry-banner";
  div.style.cssText="background:#FFF3CD;border:1px solid #E9A919;border-radius:10px;padding:12px 14px;margin-bottom:14px;text-align:center;font-size:13px;color:#7A5000";
  div.innerHTML=`⚠️ تعذر تحميل البيانات — تأكد من الاتصال<br><button onclick="retryLoad()" style="margin-top:8px;background:#2D6A4F;color:white;border:none;border-radius:8px;padding:7px 18px;font-family:'Cairo',sans-serif;font-size:13px;font-weight:600;cursor:pointer">🔄 إعادة المحاولة</button>`;
  box.insertBefore(div,box.firstChild);
}

async function retryLoad(){
  const banner=document.getElementById("retry-banner");
  if(banner) banner.remove();
  await loadAll();
  // Refresh dropdown if class was selected
  const cls=document.getElementById("sel-class").value;
  if(cls) document.getElementById("sel-class").dispatchEvent(new Event("change"));
}

function getPassword(role, cls){
  // Try sheet passwords first
  const entry = DATA.passwords.find(p=>{
    if(role==="admin") return p.role==="قائد القطاع";
    if(role==="teamleader") return p.role==="قائد الفريق" && p.cls===cls;
    if(role==="assistant") return p.role==="مساعد قائد" && p.cls===cls;
    return false;
  });
  if(entry) return entry.password;
  // Fallback defaults
  if(role==="admin") return "Jesus2026";
  return "";
}

function selectRole(r){
  currentRole=r;
  ["assistant","teamleader","admin"].forEach(x=>document.getElementById("rt-"+x).classList.toggle("active",x===r));
  document.getElementById("lf-leader").style.display=r==="admin"?"none":"block";
  document.getElementById("lf-admin").style.display=r==="admin"?"block":"none";
  // hide name field for teamleader (no need to pick name, just cls+pass)
  document.getElementById("lf-name-wrap").style.display=r==="assistant"?"block":"none";
}

document.getElementById("sel-class").addEventListener("change",function(){
  const cls=this.value;

  sel.innerHTML='<option value="">-- اختار --</option>'+list.map(l=>`<option value="${l.id}">${l.name}</option>`).join("");
});

function doLogin(){
  const err=document.getElementById("login-err");
  err.style.display="none";
  const pass=document.getElementById("login-pass").value.trim();
  const cls=document.getElementById("sel-class").value;

  if(currentRole==="admin"){
    if(pass!==getPassword("admin","")) {err.textContent="كلمة السر غلط";err.style.display="block";return;}
    CU={role:"admin",name:"قائد القطاع",cls:""};
  } else if(currentRole==="teamleader"){
    if(!cls){err.textContent="اختار الفصل";err.style.display="block";return;}
    if(pass!==getPassword("teamleader",cls)){err.textContent="كلمة السر غلط";err.style.display="block";return;}
    CU={role:"teamleader",name:`قائد فريق ${cls}`,cls};
  } else {
    const lid=document.getElementById("sel-leader").value;
    if(!cls||!lid){err.textContent="اختار الفصل والاسم";err.style.display="block";return;}
    if(pass!==getPassword("assistant",cls)){err.textContent="كلمة السر غلط";err.style.display="block";return;}
    const leader=DATA.leaders.find(l=>l.id==lid);
    if(!leader){err.textContent="القائد غير موجود";err.style.display="block";return;}
    CU={role:"assistant",name:leader.name,id:leader.id,cls};
  }
  document.getElementById("screen-login").classList.remove("active");
  document.getElementById("screen-app").classList.add("active");
  initApp();
}

function doLogout(){
  CU=null;
  document.getElementById("screen-app").classList.remove("active");
  document.getElementById("screen-login").classList.add("active");
  document.getElementById("login-pass").value="";
  ["assistant","teamleader","admin"].forEach(r=>document.getElementById("tabs-"+r).style.display="none");
}

function showTab(name,role){
  document.querySelectorAll(`#tabs-${role} .tab-content`).forEach(t=>t.classList.remove("active"));
  document.querySelectorAll(`#tabs-${role} .tab-btn`).forEach(t=>t.classList.remove("active"));
  document.getElementById("tab-"+name).classList.add("active");
  event.target.classList.add("active");
}

function openModal(title,body,onOk){
  document.getElementById("modal-title").textContent=title;
  document.getElementById("modal-body").innerHTML=body;
  document.getElementById("modal-ok").onclick=onOk;
  document.getElementById("modal-ov").classList.add("open");
}
function closeModal(){ document.getElementById("modal-ov").classList.remove("open"); }

function meetParasHTML(m, highlightMine){
  let h=`<div class="meet-body">`;
  PARA_KEYS.forEach(k=>{
    const p=m.paras[k]||{};
    const mine=highlightMine&&(p.leaders||[]).includes(CU?.id);
    h+=`<div class="para-item ${mine?"mine":""}">
      <div class="para-lbl">${PARA_NAMES[k]}</div>
      <div class="para-topic">${p.topic||"—"}</div>
      <div class="para-ldrs">${lNamesArr(p.leaders)}${mine?" ⭐":""}</div>
    </div>`;
  });
  h+=`</div>`;
  return h;
}

function getUpcomingMeeting(){
  const today=new Date(); today.setHours(0,0,0,0);
  const sorted=[...DATA.meetings].sort((a,b)=>new Date(a.date)-new Date(b.date));
  return sorted.find(m=>new Date(m.date)>=today) || sorted[sorted.length-1];
}

function rAsPlan(){
  const c=document.getElementById("tab-as-plan");
  if(!DATA.meetings.length){c.innerHTML=`<div class="empty-state"><div class="ei">📅</div>لم تُضف اجتماعات بعد</div>`;return;}
  const upcoming=getUpcomingMeeting();
  const rest=[...DATA.meetings].filter(m=>m.id!==upcoming?.id).sort((a,b)=>new Date(a.date)-new Date(b.date));

  let h=`<h2 class="sec-title">خطة اجتماعات السنة</h2>`;

  // Featured upcoming meeting
  if(upcoming){
    h+=`<div style="background:linear-gradient(135deg,#1B4332,#2D6A4F);border-radius:16px;padding:18px;margin-bottom:18px;color:white">
      <div style="font-size:11px;font-weight:700;opacity:.75;margin-bottom:6px;letter-spacing:1px">▶ الاجتماع القادم</div>
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:14px">
        <span style="font-size:18px;font-weight:700">اجتماع ${upcoming.num}</span>
        <span style="font-size:14px;opacity:.85">📅 ${fDate(upcoming.date)}</span>
        <span style="background:rgba(255,255,255,0.2);padding:3px 12px;border-radius:20px;font-size:12px">المسئول: ${lName(upcoming.responsible)}</span>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">`;
    PARA_KEYS.forEach(k=>{
      const p=upcoming.paras[k]||{};
      const mine=(p.leaders||[]).includes(CU?.id);
      h+=`<div style="background:rgba(255,255,255,${mine?'0.25':'0.12'});border-radius:10px;padding:10px 12px;border:1px solid rgba(255,255,255,${mine?'0.5':'0.15'})">
        <div style="font-size:10px;font-weight:700;opacity:.7;margin-bottom:3px">${PARA_NAMES[k]}</div>
        <div style="font-size:11px;opacity:.8;margin-bottom:3px;font-style:italic">${p.topic||"—"}</div>
        <div style="font-size:13px;font-weight:700">${lNamesArr(p.leaders)}${mine?" ⭐":""}</div>
      </div>`;
    });
    h+=`</div></div>`;
  }

  // Accordion for rest
  if(rest.length){
    h+=`<div style="font-size:13px;font-weight:700;color:var(--mu);margin-bottom:10px">باقي الاجتماعات</div>`;
    rest.forEach(m=>{
      h+=`<div class="meet-card" style="margin-bottom:8px">
        <div class="meet-hd" style="cursor:pointer" onclick="toggleAccordion('acc-${m.id}',this)">
          <span class="meet-num">اجتماع ${m.num}</span>
          <span class="meet-date">${fDate(m.date)}</span>
          <span class="meet-resp">المسئول: ${lName(m.responsible)}</span>
          <span style="font-size:16px;color:var(--mu);margin-right:auto" id="acc-icon-${m.id}">▼</span>
        </div>
        <div id="acc-${m.id}" style="display:none">
          ${meetParasHTML(m, true)}
        </div>
      </div>`;
    });
  }
  c.innerHTML=h;
}

function toggleAccordion(id, hd){
  const el=document.getElementById(id);
  const icon=document.getElementById("acc-icon-"+id.replace("acc-",""));
  if(el.style.display==="none"){el.style.display="block";if(icon)icon.textContent="▲";}
  else{el.style.display="none";if(icon)icon.textContent="▼";}
}

function rTLPlan(){
  const c=document.getElementById("tab-tl-plan");
  if(!DATA.meetings.length){c.innerHTML=`<div class="empty-state"><div class="ei">📅</div>لم يُضف قائد القطاع اجتماعات بعد</div>`;return;}
  const ml=myLdrs();
  let h=`<h2 class="sec-title">توزيع فقرات الخطة <span class="badge bg-a">${CU.cls}</span></h2>
  <div class="card" style="margin-bottom:12px;font-size:13px;color:var(--mu)">💡 حدد القادة المسئولين عن كل فقرة (يمكن اختيار أكثر من قائد).</div>`;
  DATA.meetings.forEach(m=>{
    h+=`<div class="meet-card"><div class="meet-hd">
      <span class="meet-num">اجتماع ${m.num}</span>
      <span class="meet-date">${fDate(m.date)}</span>
    </div><div style="padding:12px 16px">
    <div class="fr fr1" style="margin-bottom:10px"><div class="fg"><label>المسئول العام</label>
      <select onchange="m${m.id}_setResp(this.value)"><option value="">-- اختار --</option>${lOpts(ml)}</select>
    </div></div>
    <div class="meet-body">`;
    PARA_KEYS.forEach(k=>{
      const p=m.paras[k]||{topic:"",leaders:[]};
      h+=`<div class="para-item">
        <div class="para-lbl">${PARA_NAMES[k]}</div>
        <input type="text" class="notes" style="min-height:30px;margin-bottom:6px" placeholder="عنوان الفقرة..." value="${p.topic||""}"
          onchange="setPTopic(${m.id},'${k}',this.value)">
        <select multiple style="width:100%;padding:4px 8px;border:1.5px solid var(--bd);border-radius:8px;font-family:'Cairo',sans-serif;font-size:12px;height:80px"
          onchange="setPLeaders(${m.id},'${k}',this)">
          ${lMultiOpts(ml,p.leaders)}
        </select>
      </div>`;
    });
    h+=`</div></div></div>`;
  });
  h+=`<button class="sv-btn" style="margin-top:8px" onclick="saveTLPlan()">💾 حفظ التوزيع في الشيت</button>`;
  c.innerHTML=h;
  // attach responsible setters
  DATA.meetings.forEach(m=>{
    window[`m${m.id}_setResp`]=(lid)=>{ const mt=DATA.meetings.find(x=>x.id===m.id); if(mt) mt.responsible=parseInt(lid); };
  });
}
function setPTopic(mid,k,v){ const m=DATA.meetings.find(m=>m.id==mid); if(m){if(!m.paras[k])m.paras[k]={};m.paras[k].topic=v;} }
function setPLeaders(mid,k,sel){
  const m=DATA.meetings.find(m=>m.id==mid);
  if(m){if(!m.paras[k])m.paras[k]={};m.paras[k].leaders=Array.from(sel.selectedOptions).map(o=>parseInt(o.value));}
  rAsPlan();
}
function saveTLPlan(){
  DATA.meetings.forEach(m=>{
    PARA_KEYS.forEach(k=>{
      const p=m.paras[k]||{};
      if(p.leaders&&p.leaders.length) sheetPost({sheet:"توزيع الخطة",row:[`اجتماع ${m.num}`,fDate(m.date),PARA_NAMES[k],p.topic||"",lNamesArr(p.leaders)]});
    });
  });
}

function assignKid(cid,lid){
  const ch=DATA.children.find(c=>c.id===cid);

}
function editChildTL(id){
  const ch=DATA.children.find(c=>c.id===id);
  const ml=myLdrs();
  openModal("تعديل: "+ch.name,
    `<div class="fr"><div class="fg"><label>التليفون</label><input type="text" id="ec-ph" value="${ch.phone||""}"></div>
    <div class="fg"><label>العنوان</label><input type="text" id="ec-ad" value="${ch.addr||""}"></div></div>
    <div class="fr fr1"><div class="fg"><label>القائد المسئول</label><select id="ec-lid"><option value="0">--</option>${lOpts(ml)}</select></div></div>`,
    ()=>{ ch.phone=document.getElementById("ec-ph").value; ch.addr=document.getElementById("ec-ad").value; ch.lid=parseInt(document.getElementById("ec-lid").value)||0; closeModal(); rTLChildren(); }
  );
}

function savePassword(){
  const role=document.getElementById("np-role").value;
  const cls=document.getElementById("np-cls").value;
  const pass=document.getElementById("np-pass").value.trim();
  if(!pass){alert("ادخل كلمة السر");return;}
  // Update or add
  const existing=DATA.passwords.find(p=>p.role===role&&p.cls===cls);
  if(existing){ existing.password=pass; }
  else { DATA.passwords.push({role,cls,password:pass}); }
  sheetPost({sheet:"كلمات السر",row:[role,cls,pass]});
  rPasswords();
}
function delPassword(i){
  if(!confirm("حذف كلمة السر دي؟"))return;
  DATA.passwords.splice(i,1);
  rPasswords();
}

    if(!byM[i])continue;
    h+=`<div style="margin-bottom:18px"><div class="mo-title">🗓 ${MONTHS[i]}</div>`;
    byM[i].forEach(l=>{
      const isT=l.dob&&l.dob.slice(5)===`${mm}-${dd}`;
      h+=`<div class="bday-item ${isT?"bday-today":""}"><div class="bday-av">${l.name[0]}</div><div style="flex:1;font-size:14px;font-weight:700">${l.name}${isT?" 🎂":""}</div><div style="font-size:12px;color:var(--mu)">${fDate(l.dob)}</div><span class="badge ${isT?"bg-a":"bg-g"}">${isT?"اليوم!":l.cls}</span></div>`;
    });
    h+=`</div>`;
  }
  c.innerHTML=h;
}

// =========================================================
// REPORTS
// =========================================================
function rReports(prefix){
  const scope = prefix==="tl" ? myKids() : DATA.children;
  const scopeLdrs = prefix==="tl" ? myLdrs() : DATA.leaders;
  const c=document.getElementById(`tab-${prefix}-reports`);
  const total=scope.length;
  const done=scope.filter(ch=>DATA.followup["f_"+ch.id]==="done").length;
  const pct=total?Math.round(done/total*100):0;
  const lastM=DATA.meetings[DATA.meetings.length-1];
  let pr=0,ex=0,ab=0;
  scope.forEach(ch=>{const s=DATA.attendance[`att_${lastM?.id||0}_${ch.id}`];if(s==="present")pr++;else if(s==="excused")ex++;else if(s==="absent")ab++;});
  let h=`<h2 class="sec-title">التقارير${prefix==="tl"?` — ${CU.cls}`:""}</h2>
  <div class="stats-grid">
    <div class="stat-box"><div class="stat-num">${total}</div><div class="stat-lbl">إجمالي الأولاد</div></div>
    <div class="stat-box"><div class="stat-num">${done}/${total}</div><div class="stat-lbl">تم افتقادهم</div><div class="prog"><div class="prog-fill" style="width:${pct}%"></div></div></div>
    <div class="stat-box"><div class="stat-num" style="color:var(--g)">${pr}</div><div class="stat-lbl">حضروا (آخر اجتماع)</div></div>
    <div class="stat-box"><div class="stat-num" style="color:var(--am)">${ex}</div><div class="stat-lbl">بعذر</div></div>
    <div class="stat-box"><div class="stat-num" style="color:var(--rd)">${ab}</div><div class="stat-lbl">بدون عذر</div></div>
    <div class="stat-box"><div class="stat-num">${scopeLdrs.length}</div><div class="stat-lbl">القادة</div></div>
  </div>`;
  if(scopeLdrs.length){
    h+=`<div class="card"><div style="font-size:14px;font-weight:700;margin-bottom:12px">افتقاد الأولاد — كل قائد</div><div class="tw"><table><thead><tr><th>القائد</th><th>الفصل</th><th>الأولاد</th><th>تم</th><th>النسبة</th></tr></thead><tbody>`;
    scopeLdrs.forEach(l=>{
      const kids=DATA.children.filter(c=>c.lid==l.id);
      const d=kids.filter(c=>DATA.followup["f_"+c.id]==="done").length;
      const p=kids.length?Math.round(d/kids.length*100):0;
      h+=`<tr><td><b>${l.name}</b></td><td>${l.cls}</td><td>${kids.length}</td><td>${d}</td><td><div style="display:flex;align-items:center;gap:7px"><div class="prog" style="flex:1;min-width:50px"><div class="prog-fill" style="width:${p}%"></div></div><b style="font-size:11px;color:var(--g)">${p}%</b></div></td></tr>`;
    });
    h+=`</tbody></table></div></div>`;

    // Leaders visitation report — grouped by class
    const lvisitLdrs = prefix==="ad" ? DATA.leaders : scopeLdrs;
    const lDone = lvisitLdrs.filter(l=>DATA.lvisit["lv_"+l.id]==="done").length;
    const lPct = lvisitLdrs.length ? Math.round(lDone/lvisitLdrs.length*100) : 0;
    h+=`<div class="card" style="margin-top:16px">
      <div style="font-size:14px;font-weight:700;margin-bottom:12px">افتقاد القادة 👥</div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <span style="font-size:13px;color:var(--mu)">إجمالي القطاع</span>
        <b style="color:var(--g)">${lDone}/${lvisitLdrs.length} (${lPct}%)</b>
      </div>
      <div class="prog" style="margin-bottom:16px"><div class="prog-fill" style="width:${lPct}%"></div></div>
      <div class="tw"><table><thead><tr><th>القائد</th><th>الفصل</th><th>حالة الافتقاد</th><th>ملاحظات</th></tr></thead><tbody>`;
    lvisitLdrs.forEach(l=>{
      const st=DATA.lvisit["lv_"+l.id]||"";
      const nt=DATA.lvisit["lv_"+l.id+"_n"]||"";
      h+=`<tr>
        <td><b>${l.name}</b></td>
        <td>${l.cls}</td>
        <td><span class="badge ${st==="done"?"bg-g":"bg-r"}">${st==="done"?"تم ✓":"لم يتم"}</span></td>
        <td style="font-size:12px;color:var(--mu)">${nt||"—"}</td>
      </tr>`;
    });
    h+=`</tbody></table></div>`;

    // Per-class breakdown for admin
    if(prefix==="ad"){
      h+=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px">`;
      ["ملايكة أ","ملايكة ب"].forEach(cls=>{
        const clsLdrs=DATA.leaders.filter(l=>l.cls===cls||l.cls==="كلا الفصلين");
        const clsDone=clsLdrs.filter(l=>DATA.lvisit["lv_"+l.id]==="done").length;
        const clsPct=clsLdrs.length?Math.round(clsDone/clsLdrs.length*100):0;
        h+=`<div class="stat-box"><div style="font-size:13px;font-weight:700;margin-bottom:8px">${cls}</div>
          <div class="stat-num" style="font-size:22px">${clsDone}/${clsLdrs.length}</div>
          <div class="stat-lbl">قادة تم افتقادهم</div>
          <div class="prog"><div class="prog-fill" style="width:${clsPct}%"></div></div>
        </div>`;
      });
      h+=`</div>`;
    }
    h+=`</div>`;
  }
  c.innerHTML=h;
}

// =========================================================
// STARTUP
// =========================================================
selectRole("teamleader");
window.addEventListener("load", async ()=>{
  await loadAll();
  const cls=document.getElementById("sel-class").value;
  if(cls) document.getElementById("sel-class").dispatchEvent(new Event("change"));
});

// Also refresh data after successful login to ensure freshness
const _origInitApp=initApp;
initApp=function(){
  _origInitApp();
};
</script>
