<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قطاع الملايكة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --g:#2D6A4F;--gm:#40916C;--gl:#74C69D;--gp:#D8F3DC;--gf:#F0FAF3;
  --am:#E9A919;--ap:#FFF3CD;--rd:#C0392B;--rp:#FDECEA;
  --bl:#2563EB;--bp:#EFF6FF;
  --tx:#1A2E22;--tm:#3D5A47;--mu:#7A9585;--bd:#C8E6D0;--bg:#F4FAF6;
  --r:10px;--sh:0 1px 4px rgba(45,106,79,0.10);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;font-size:15px}
.screen{display:none;min-height:100vh}.screen.active{display:flex;flex-direction:column}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* LOADING */
#loading-overlay{display:none;position:fixed;inset:0;background:rgba(27,67,50,0.94);z-index:9999;align-items:center;justify-content:center;flex-direction:column;gap:14px}
.spin{width:44px;height:44px;border:4px solid rgba(255,255,255,0.25);border-top-color:#fff;border-radius:50%;animation:spin .75s linear infinite}
.loading-txt{color:#fff;font-size:14px;font-weight:600}

/* LOGIN */
#screen-login{align-items:center;justify-content:center;background:linear-gradient(160deg,#1B4332 0%,#2D6A4F 55%,#40916C 100%);padding:20px}
.login-box{background:#fff;border-radius:20px;padding:36px;width:100%;max-width:440px;box-shadow:0 8px 32px rgba(0,0,0,0.2)}
.login-logo{text-align:center;margin-bottom:20px}
.logo-ic{width:58px;height:58px;background:var(--gp);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;margin-bottom:9px}
.login-logo h1{font-size:21px;font-weight:700;color:var(--g)}
.login-logo p{font-size:13px;color:var(--mu);margin-top:3px}
.lbl{font-size:13px;font-weight:600;color:var(--tm);margin-bottom:5px;display:block}
.fi{width:100%;padding:10px 13px;border:1.5px solid var(--bd);border-radius:var(--r);font-family:'Cairo',sans-serif;font-size:14px;color:var(--tx);background:#fff;margin-bottom:13px;outline:none}
.fi:focus{border-color:var(--gm)}
.role-tabs{display:flex;gap:7px;margin-bottom:15px}
.rt{flex:1;padding:9px 4px;border:2px solid var(--bd);border-radius:var(--r);background:#fff;font-family:'Cairo',sans-serif;font-size:13px;font-weight:600;cursor:pointer;color:var(--mu);transition:all .15s;text-align:center}
.rt.active{border-color:var(--g);background:var(--gf);color:var(--g)}
.login-btn{width:100%;padding:12px;background:var(--g);color:#fff;border:none;border-radius:var(--r);font-family:'Cairo',sans-serif;font-size:16px;font-weight:700;cursor:pointer}
.login-btn:hover{background:var(--gm)}
.login-err{color:var(--rd);font-size:13px;text-align:center;margin-bottom:10px;display:none}

/* HEADER */
.app-header{background:var(--g);color:#fff;padding:0 16px;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,0.12)}
.hd-title{font-size:15px;font-weight:700}.hd-sub{font-size:11px;opacity:.75}
.hd-right{display:flex;align-items:center;gap:8px}
.role-bdg{background:rgba(255,255,255,0.2);padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.logout-btn{background:rgba(255,255,255,0.15);border:none;color:#fff;padding:6px 12px;border-radius:20px;font-family:'Cairo',sans-serif;font-size:12px;cursor:pointer}
.bday-banner{background:var(--am);color:#5C3D00;padding:8px 16px;font-size:13px;font-weight:600;display:none;text-align:center}

/* TABS */
.tabs-bar{display:flex;background:#fff;border-bottom:2px solid var(--bd);padding:0 12px;overflow-x:auto;position:sticky;top:52px;z-index:90;scrollbar-width:none}
.tabs-bar::-webkit-scrollbar{display:none}
.tab-btn{padding:11px 13px;font-family:'Cairo',sans-serif;font-size:13px;font-weight:600;border:none;background:none;cursor:pointer;color:var(--mu);white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-2px;transition:all .15s}
.tab-btn.active{color:var(--g);border-bottom-color:var(--g)}
.tab-content{display:none;padding:16px;max-width:960px;margin:0 auto;width:100%}
.tab-content.active{display:block;animation:fade .2s ease}

/* CARDS */
.card{background:#fff;border-radius:14px;box-shadow:var(--sh);padding:16px;margin-bottom:13px;border:1px solid var(--bd)}
.sec-title{font-size:15px;font-weight:700;color:var(--g);margin-bottom:13px;padding-bottom:8px;border-bottom:2px solid var(--gp);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.badge{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px}
.bg-g{background:var(--gp);color:var(--g)}.bg-a{background:var(--ap);color:#7A5000}
.bg-r{background:var(--rp);color:var(--rd)}.bg-b{background:var(--bp);color:var(--bl)}.bg-gray{background:#f0f0f0;color:#555}
.empty-state{text-align:center;padding:36px 16px;color:var(--mu);font-size:14px}
.empty-state .ei{font-size:36px;margin-bottom:8px}

/* MEETING */
.meet-card{background:#fff;border-radius:14px;box-shadow:var(--sh);border:1px solid var(--bd);margin-bottom:11px;overflow:hidden}
.meet-hd{background:var(--gf);padding:10px 15px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--bd);flex-wrap:wrap;gap:7px}
.meet-num{font-size:14px;font-weight:700;color:var(--g)}
.meet-date{font-size:12px;color:var(--mu);font-weight:600}
.meet-resp{font-size:11px;background:var(--gp);color:var(--g);padding:3px 9px;border-radius:20px}
.meet-body{padding:11px 15px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.para-item{padding:9px 11px;border-radius:8px;border:1.5px solid var(--bd);background:var(--bg)}
.para-item.mine{border-color:var(--am);background:var(--ap)}
.para-lbl{font-size:10px;font-weight:700;color:var(--mu);margin-bottom:2px}
.para-topic{font-size:11px;color:var(--tm);margin-bottom:3px;font-style:italic}
.para-ldrs{font-size:12px;font-weight:600;color:var(--tx)}
.para-item.mine .para-ldrs{color:#7A5000}

/* ROWS */
.child-row{background:#fff;border-radius:12px;box-shadow:var(--sh);border:1px solid var(--bd);padding:12px 14px;margin-bottom:9px}
.child-rh{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px}
.child-name{font-size:14px;font-weight:700}
.child-info{font-size:12px;color:var(--mu);margin-bottom:8px;line-height:1.8}
.st-btns{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.st-btn{padding:6px 12px;border-radius:20px;border:1.5px solid var(--bd);background:#fff;font-family:'Cairo',sans-serif;font-size:12px;font-weight:600;cursor:pointer;color:var(--mu);transition:all .15s}
.st-btn.sp,.st-btn.sd{background:var(--gp);border-color:var(--gl);color:var(--g)}
.st-btn.se{background:var(--ap);border-color:var(--am);color:#7A5000}
.st-btn.sa{background:var(--rp);border-color:var(--rd);color:var(--rd)}
.notes{width:100%;padding:7px 10px;border:1.5px solid var(--bd);border-radius:8px;font-family:'Cairo',sans-serif;font-size:13px;color:var(--tx);resize:vertical;min-height:44px;outline:none}
.notes:focus{border-color:var(--gm)}

/* TABLE */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--gf);padding:9px 10px;text-align:right;font-weight:700;color:var(--g);border-bottom:2px solid var(--bd);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--bd);vertical-align:middle}
tr:hover td{background:var(--gf)}
.abtns{display:flex;gap:5px}
.ab{padding:4px 11px;border-radius:20px;border:none;font-family:'Cairo',sans-serif;font-size:11px;font-weight:600;cursor:pointer}
.ab-g{background:var(--gp);color:var(--g)}.ab-a{background:var(--ap);color:#7A5000}.ab-r{background:var(--rp);color:var(--rd)}

/* FORM */
.add-form{background:var(--gf);border:1.5px solid var(--bd);border-radius:12px;padding:15px;margin-bottom:16px}
.add-form h3{font-size:13px;font-weight:700;color:var(--g);margin-bottom:11px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.fr3{grid-template-columns:1fr 1fr 1fr}.fr1{grid-template-columns:1fr}
.fg label{display:block;font-size:11px;font-weight:600;color:var(--tm);margin-bottom:3px}
.fg input,.fg select,.fg textarea{width:100%;padding:8px 10px;border:1.5px solid var(--bd);border-radius:8px;font-family:'Cairo',sans-serif;font-size:13px;color:var(--tx);background:#fff;outline:none}
.fg input:focus,.fg select:focus{border-color:var(--gm)}
.fg select[multiple]{height:88px;padding:4px}
.sv-btn{background:var(--g);color:#fff;border:none;border-radius:8px;padding:9px 20px;font-family:'Cairo',sans-serif;font-size:13px;font-weight:700;cursor:pointer}
.cn-btn{background:#f0f0f0;color:#555;border:none;border-radius:8px;padding:9px 20px;font-family:'Cairo',sans-serif;font-size:13px;cursor:pointer;margin-right:6px}

/* MODAL */
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:500;display:none;align-items:center;justify-content:center;padding:16px}
.modal-ov.open{display:flex}
.modal{background:#fff;border-radius:16px;padding:22px;width:100%;max-width:500px;box-shadow:0 8px 32px rgba(0,0,0,0.2);max-height:90vh;overflow-y:auto;animation:fade .2s ease}
.modal-title{font-size:15px;font-weight:700;color:var(--g);margin-bottom:16px}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}

/* STATS */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:10px;margin-bottom:16px}
.stat-box{background:#fff;border-radius:12px;padding:14px;box-shadow:var(--sh);border:1px solid var(--bd);text-align:center}
.stat-num{font-size:25px;font-weight:700;color:var(--g);line-height:1}
.stat-lbl{font-size:11px;color:var(--mu);margin-top:4px}
.prog{height:6px;border-radius:3px;background:var(--gp);margin-top:5px;overflow:hidden}
.prog-fill{height:100%;border-radius:3px;background:var(--g)}

/* BIRTHDAYS */
.mo-title{font-size:13px;font-weight:700;color:var(--tm);margin-bottom:7px;padding:5px 11px;background:var(--gf);border-radius:8px;display:inline-block}
.bday-item{display:flex;align-items:center;gap:10px;padding:9px 12px;background:#fff;border-radius:10px;margin-bottom:7px;border:1px solid var(--bd);box-shadow:var(--sh)}
.bday-av{width:30px;height:30px;border-radius:50%;background:var(--gp);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--g);flex-shrink:0}
.bday-today{border-color:var(--am);background:var(--ap)}

/* SYNC */
.sync-ind{position:fixed;bottom:12px;left:12px;background:var(--g);color:#fff;padding:7px 14px;border-radius:20px;font-size:11px;font-weight:600;display:none;z-index:999;box-shadow:0 2px 8px rgba(0,0,0,0.2)}
.sync-ind.err{background:var(--rd)}

/* LATT */
.latt-row{background:#fff;border-radius:12px;padding:12px 14px;margin-bottom:8px;border:1px solid var(--bd)}
.latt-name{font-size:14px;font-weight:700;margin-bottom:7px}
.latt-ctrl{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.uni-tog{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--mu)}
.uni-tog input{accent-color:var(--g);width:14px;height:14px}

/* ACT */
.act-card{display:flex;align-items:center;gap:12px;background:#fff;border-radius:12px;padding:12px 14px;margin-bottom:8px;border:1px solid var(--bd);box-shadow:var(--sh)}
.act-icon{width:38px;height:38px;border-radius:9px;background:var(--gp);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}

/* PASS */
.pass-row{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;background:#fff;border-radius:10px;border:1px solid var(--bd);margin-bottom:7px;box-shadow:var(--sh)}

@media(max-width:600px){
  .meet-body,.fr,.fr3{grid-template-columns:1fr}
  .stats-grid{grid-template-columns:repeat(2,1fr)}
  .tab-btn{padding:10px 9px;font-size:12px}
  .login-box{padding:22px 16px}
}
</style>
</head>
<body>
<div id="sync-ind" class="sync-ind"></div>
<div id="loading-overlay" style="display:none;position:fixed;inset:0;background:rgba(27,67,50,0.94);z-index:9999;align-items:center;justify-content:center;flex-direction:column;gap:14px">
  <div class="spin"></div><div class="loading-txt">جاري تحميل البيانات...</div>
</div>

<!-- MODAL — single global modal, callback stored in closure -->
<div class="modal-ov" id="modal-ov" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-title" id="modal-title"></div>
    <div id="modal-body"></div>
    <div class="modal-footer">
      <button class="cn-btn" onclick="closeModal()">إلغاء</button>
      <button class="sv-btn" id="modal-ok">حفظ</button>
    </div>
  </div>
</div>

<!-- LOGIN -->
<div id="screen-login" class="screen active">
  <div class="login-box">
    <div class="login-logo">
      <div class="logo-ic"><svg width="28" height="28" viewBox="0 0 24 24" fill="#2D6A4F"><path d="M17 12h-5v5h5v-5zM16 1v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2h-1V1h-2zm3 18H5V8h14v11z"/></svg></div>
      <h1>قطاع الملايكة</h1><p>نظام إدارة الكشافة</p>
    </div>
    <div class="role-tabs">
      <button class="rt" id="rt-assistant" onclick="selectRole('assistant')">مساعد قائد</button>
      <button class="rt active" id="rt-teamleader" onclick="selectRole('teamleader')">قائد الفريق</button>
      <button class="rt" id="rt-admin" onclick="selectRole('admin')">قائد القطاع</button>
    </div>
    <div id="lf-leader">
      <label class="lbl">الفصل:</label>
      <select class="fi" id="sel-class">
        <option value="">-- اختار --</option>
        <option value="ملايكة أ">ملايكة أ</option>
        <option value="ملايكة ب">ملايكة ب</option>

      <div id="lf-name-wrap" style="display:none">
        <label class="lbl">اسمك:</label>
        <select class="fi" id="sel-leader"><option value="">-- اختار الفصل أولاً --</option></select>
      </div>
    </div>
    <div id="lf-admin" style="display:none"></div>
    <label class="lbl">كلمة السر:</label>
    <input class="fi" type="password" id="login-pass" placeholder="ادخل كلمة السر" onkeydown="if(event.key==='Enter')doLogin()">
    <p class="login-err" id="login-err">كلمة السر غلط</p>
    <button class="login-btn" onclick="doLogin()">دخول</button>
  </div>
</div>

<!-- APP -->
<div id="screen-app" class="screen">
  <div class="bday-banner" id="bday-banner">🎂 عيد ميلاد سعيد يا <span id="bday-nm"></span>!</div>
  <div class="app-header">
    <div><div class="hd-title" id="hd-title">قطاع الملايكة</div><div class="hd-sub" id="hd-sub"></div></div>
    <div class="hd-right"><span class="role-bdg" id="role-bdg"></span><button class="logout-btn" onclick="doLogout()">خروج</button></div>
  </div>

  <div id="tabs-assistant" style="display:none">
    <div class="tabs-bar">
      <button class="tab-btn active" onclick="showTab('as-plan','assistant')">خطة السنة</button>
      <button class="tab-btn" onclick="showTab('as-followup','assistant')">الافتقاد</button>
      <button class="tab-btn" onclick="showTab('as-activities','assistant')">الأنشطة</button>
      <button class="tab-btn" onclick="showTab('as-attendance','assistant')">التحضير</button>
    </div>
    <div id="tab-as-plan" class="tab-content active"></div>
    <div id="tab-as-followup" class="tab-content"></div>
    <div id="tab-as-activities" class="tab-content"></div>
    <div id="tab-as-attendance" class="tab-content"></div>
  </div>

  <div id="tabs-teamleader" style="display:none">
    <div class="tabs-bar">
      <button class="tab-btn active" onclick="showTab('tl-plan','teamleader')">توزيع الخطة</button>
      <button class="tab-btn" onclick="showTab('tl-children','teamleader')">الأولاد</button>
      <button class="tab-btn" onclick="showTab('tl-latt','teamleader')">حضور القادة</button>
      <button class="tab-btn" onclick="showTab('tl-catt','teamleader')">حضور الأولاد</button>
      <button class="tab-btn" onclick="showTab('tl-followup','teamleader')">الافتقاد</button>
      <button class="tab-btn" onclick="showTab('tl-lvisit','teamleader')">افتقاد القادة</button>
      <button class="tab-btn" onclick="showTab('tl-activities','teamleader')">الأنشطة</button>
      <button class="tab-btn" onclick="showTab('tl-reports','teamleader')">التقارير</button>
    </div>
    <div id="tab-tl-plan" class="tab-content active"></div>
    <div id="tab-tl-children" class="tab-content"></div>
    <div id="tab-tl-latt" class="tab-content"></div>
    <div id="tab-tl-catt" class="tab-content"></div>
    <div id="tab-tl-followup" class="tab-content"></div>
    <div id="tab-tl-lvisit" class="tab-content"></div>
    <div id="tab-tl-activities" class="tab-content"></div>
    <div id="tab-tl-reports" class="tab-content"></div>
  </div>

  <div id="tabs-admin" style="display:none">
    <div class="tabs-bar">
      <button class="tab-btn active" onclick="showTab('ad-plan','admin')">خطة الاجتماعات</button>
      <button class="tab-btn" onclick="showTab('ad-children','admin')">الأولاد</button>
      <button class="tab-btn" onclick="showTab('ad-leaders','admin')">القادة</button>
      <button class="tab-btn" onclick="showTab('ad-latt','admin')">حضور القادة</button>
      <button class="tab-btn" onclick="showTab('ad-birthdays','admin')">أعياد الميلاد</button>
      <button class="tab-btn" onclick="showTab('ad-reports','admin')">التقارير</button>
      <button class="tab-btn" onclick="showTab('ad-passwords','admin')">كلمات السر</button>
    </div>
    <div id="tab-ad-plan" class="tab-content active"></div>
    <div id="tab-ad-children" class="tab-content"></div>
    <div id="tab-ad-leaders" class="tab-content"></div>
    <div id="tab-ad-latt" class="tab-content"></div>
    <div id="tab-ad-birthdays" class="tab-content"></div>
    <div id="tab-ad-reports" class="tab-content"></div>
    <div id="tab-ad-passwords" class="tab-content"></div>
  </div>
</div>

const AS_URL="https://script.google.com/macros/s/AKfycbzjGKLbjSnmsuj3x5F-kDztIftSW7Cyhy3XtSEkWRrq8xeHPgvS0Qn1vkQKt_eWRSnyPw/exec";

const nxtId=arr=>arr.length?Math.max(...arr.map(x=>x.id))+1:1;
function fDate(d){
  if(!d)return"—";
  try{
    // Handle ISO strings like 2026-10-01T21:00:00.000Z
    const dt=new Date(d);
    if(!isNaN(dt.getTime())){
      const day=String(dt.getDate()).padStart(2,'0');
      const mon=String(dt.getMonth()+1).padStart(2,'0');
      const yr=dt.getFullYear();
      return`${day} / ${mon} / ${yr}`;
    }
  }catch(e){}
  // Fallback: plain YYYY-MM-DD split
  const p=d.split("-");
  return p.length===3?`${p[2]} / ${p[1]} / ${p[0]}`:d;
}

// ── SHEET I/O ──────────────────────────────────────────
async function sheetGet(name,tries=2){
  for(let i=0;i<tries;i++){
    try{
      const r=await fetch(`${AS_URL}?sheet=${encodeURIComponent(name)}`);
      if(!r.ok)throw new Error("HTTP "+r.status);
      const j=await r.json();
      if(Array.isArray(j.data))return j.data;
      throw new Error("bad response");
    }catch(e){
      if(i<tries-1)await new Promise(r=>setTimeout(r,1200));
      else console.warn("sheetGet failed:",name,e.message);
    }
  }
  return[];
}
async function sheetPost(payload){
  try{
    await fetch(AS_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify(payload)});
    showSync("✓ تم الحفظ في الشيت");
  }catch(e){showSync("⚠ تعذر الحفظ",true);}
}

// Update only specific cells that changed
// changes = [ {col: "اسم العمود" | colNumber, value: newValue}, ... ]
async function sheetPatch(sheetName, matchValue, changes){
  if(!changes||!changes.length)return;
  for(const ch of changes){
    await fetch(AS_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},
      body:JSON.stringify({sheet:sheetName,action:"updateCell",match:matchValue,col:ch.col,value:ch.value})
    });
  }
  showSync("✓ تم الحفظ في الشيت");
}

async function sheetPostWithResponse(payload){
  // POST with text/plain = simple CORS request = can read response
  try{
    const res = await fetch(AS_URL,{
      method:"POST",
      headers:{"Content-Type":"text/plain"},
      body:JSON.stringify(payload)
    });
    return await res.json();
  }catch(e){
    console.error("sheetPostWithResponse error:",e);
    return {status:"error",message:e.message};
  }
}

// ── LOAD ALL ───────────────────────────────────────────
async function loadAll(){
  document.getElementById("screen-login").style.visibility="hidden";
  showLoading();
  let ok=false;
  for(let att=1;att<=3;att++){
    setLoadTxt(att>1?`إعادة المحاولة... (${att}/3)`:"جاري تحميل البيانات...");
    try{
      const[ldrs,passes,meets,acts,chA,chB]=await Promise.all([
        sheetGet("القادة"),
        sheetGet("كلمات السر"),
        sheetGet("خطة الاجتماعات"),
        sheetGet("الأنشطة"),
        sheetGet("ملايكة أ"),
        sheetGet("ملايكه ب")
      ]);

      // ── LEADERS ─────────────────────────────────────
      // A=name, B=cls, C=phone, D=dob
      DATA.leaders=ldrs.filter(r=>r[0]&&String(r[0]).trim())
        .map((r,i)=>({
          id:i+1,
          name:String(r[0]).trim(),
          cls:String(r[1]||"").trim(),
          phone:String(r[2]||"").trim(),
          dob:String(r[3]||"").trim()
        }));
      const findLdr=name=>DATA.leaders.find(l=>l.name===String(name||"").trim())?.id||null;

      // ── PASSWORDS ────────────────────────────────────
      DATA.passwords=passes.filter(r=>r[0]).map(r=>({
        role:String(r[0]).trim(),
        cls:String(r[1]||"").trim(),
        password:String(r[2]||"").trim()
      }));

      // ── MEETINGS (merged structure) ───────────────────
      // NEW structure after mergeSheets():
      // A=رقم | B=تاريخ | C=مسئول أ | D=مسئول ب
      // E=روحية-موضوع | F=روحية-قائد أ | G=روحية-قائد ب
      // H=كشفية-موضوع | I=كشفية-قائد أ | J=كشفية-قائد ب
      // K=ثقافية-موضوع | L=ثقافية-قائد أ | M=ثقافية-قائد ب
      // N=لعبة-موضوع   | O=لعبة-قائد أ  | P=لعبة-قائد ب
      // Q=أخرى-موضوع   | R=أخرى-قائد أ  | S=أخرى-قائد ب
      //
      // OLD structure (before merge) — still supported:
      // A=رقم | B=تاريخ | C=مسئول أ | D=مسئول ب
      // E=روحية topic | F=كشفية topic | G=? | H=لعبة topic | I=كشفي topic
      // J..N = leader names

      const makePara=(topic,ldrAName,ldrBName)=>{
        const la=findLdr(ldrAName),lb=findLdr(ldrBName);
        const ldrs=[];
        if(la)ldrs.push(la); if(lb&&lb!==la)ldrs.push(lb);
        return{topic:String(topic||"").trim(),leaders:ldrs,
          leaders_a:la?[la]:[],leaders_b:lb?[lb]:[]};
      };

      const meetMap={};
      // skip header row if it exists
      const meetRows=meets.filter(r=>r[0]&&String(r[0]).trim()&&!/رقم|اجتماعات/i.test(String(r[0])));
      meetRows.forEach(r=>{
        const num=String(r[0]).replace(/[^0-9]/g,"");
        if(!num)return;
        if(meetMap[num])return; // dedup — keep first row
        const isNewFormat=String(r[4]||"").includes("-موضوع")||meets[0]?.[4]==="روحية-موضوع";
        let paras;
        if(isNewFormat||meets[0]?.[4]==="روحية-موضوع"){
          // New merged format (19 cols)
          paras={
            spiritual:makePara(r[4],r[5],r[6]),
            scout:    makePara(r[7],r[8],r[9]),
            culture:  makePara(r[10],r[11],r[12]),
            game:     makePara(r[13],r[14],r[15]),
            other:    makePara(r[16],r[17],r[18])
          };
        } else {
          // Old format — topics only, no per-team leaders here
          paras={
            spiritual:makePara(r[4],"",""),
            scout:    makePara(r[5],"",""),
            culture:  makePara(r[8],"",""),
            game:     makePara(r[7],"",""),
            other:    makePara("","","")
          };
        }
        meetMap[num]={
          id:parseInt(num),num:parseInt(num),
          date:String(r[1]||"").trim(),
          responsible_a:findLdr(r[2]),
          responsible_b:findLdr(r[3]),
          paras
        };
      });
      DATA.meetings=Object.values(meetMap).sort((a,b)=>a.num-b.num);

      // ── ACTIVITIES ───────────────────────────────────
      // A=name, B=date, C=cls
      DATA.activities=acts.filter(r=>r[0]).map((r,i)=>({
        id:i+1,name:String(r[0]).trim(),date:String(r[1]||"").trim(),
        cls:String(r[2]||"").trim(),
        leader_a:findLdr(r[3]),leader_b:findLdr(r[4]),
        pdf_a:String(r[5]||"").trim()||null,
        pdf_b:String(r[6]||"").trim()||null
      }));

      // ── CHILDREN from real class sheets ──────────────
      // ملايكة أ / ملايكه ب:
      // Row 1 = headers (الاسم, العنوان, تاريخ الميلاد, تليفون الام, تليفون الاب, القائد المسئول)
      // After mergeSheets(): col F = القائد المسئول (merged from توزيع الأولاد)
      const buildKids=(rows,cls,startId)=>{
        if(!rows||rows.length<2)return[];
        // find leader column index (header row)
        const hdrs=rows[0].map(h=>String(h||"").trim());
        const ldrColIdx=hdrs.findIndex(h=>h.includes("القائد"));
        return rows.slice(1)
          .filter(r=>r[0]&&String(r[0]).trim()&&String(r[0]).trim()!=="الاسم")
          .map((r,i)=>{
            const ldrName=ldrColIdx>=0?String(r[ldrColIdx]||"").trim():"";
            return{
              id:startId+i,
              name:String(r[0]).trim(),
              cls,
              lid:findLdr(ldrName)||0,
              phone:String(r[3]||r[4]||"").trim(),
              addr:String(r[1]||"").trim(),
              dob:String(r[2]||"").trim()
            };
          });
      };
      const kidsA=buildKids(chA,"ملايكة أ",1);
      const kidsB=buildKids(chB,"ملايكة ب",1000);
      if(kidsA.length||kidsB.length) DATA.children=[...kidsA,...kidsB];

      ok=true;break;
    }catch(e){
      console.error("loadAll att"+att,e);
      if(att<3)await new Promise(r=>setTimeout(r,2000));
    }
  }
  hideLoading();
  document.getElementById("screen-login").style.visibility="visible";
  if(!ok)showRetryBanner();
}

  const box=document.querySelector(".login-box");
  document.getElementById("retry-banner")?.remove();
  const d=document.createElement("div");

function getPass(role,cls){
  const e=DATA.passwords.find(p=>{
    if(role==="admin")return p.role==="قائد القطاع";
    if(role==="teamleader")return p.role==="قائد الفريق"&&p.cls===cls;
    return p.role==="مساعد قائد"&&p.cls===cls;
  });
  if(e)return e.password;

function doLogin(){
  const err=document.getElementById("login-err");err.style.display="none";
  const pass=document.getElementById("login-pass").value.trim();
  const cls=document.getElementById("sel-class").value;
  if(currentRole==="admin"){
    if(pass!==getPass("admin",""))return(err.textContent="كلمة السر غلط",err.style.display="block");
    CU={role:"admin",name:"قائد القطاع",cls:""};
  }else if(currentRole==="teamleader"){
    if(!cls)return(err.textContent="اختار الفصل",err.style.display="block");
    if(pass!==getPass("teamleader",cls))return(err.textContent="كلمة السر غلط",err.style.display="block");
    CU={role:"teamleader",name:`قائد فريق ${cls}`,cls};
  }else{
    const lid=document.getElementById("sel-leader").value;
    if(!cls||!lid)return(err.textContent="اختار الفصل والاسم",err.style.display="block");
    if(pass!==getPass("assistant",cls))return(err.textContent="كلمة السر غلط",err.style.display="block");
    const leader=DATA.leaders.find(l=>l.id==lid);
    if(!leader)return(err.textContent="القائد غير موجود",err.style.display="block");
    CU={role:"assistant",name:leader.name,id:leader.id,cls};

  initApp();

async function uploadPdfToDrive(file, activityName, team){
  showSync("جاري رفع الملف على Drive...");
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = async (e)=>{
      try{
        const base64Full = e.target.result; // data:application/pdf;base64,XXXX
        const base64 = base64Full.split(",")[1];
        const filename = `${activityName}_${team}_${new Date().toISOString().slice(0,10)}.pdf`;
        const result = await sheetPostWithResponse({
          action:"uploadPDF",
          base64,
          filename
        });
        if(result.status==="ok" && result.viewUrl){
          showSync("✓ تم رفع الملف على Drive");
          resolve(result.viewUrl);
        } else {
          throw new Error(result.message||"Upload failed");
        }
      }catch(err){
        showSync("⚠ فشل رفع الملف — "+err.message, true);
        reject(err);
      }
    };
    reader.onerror = ()=>{ showSync("⚠ فشل قراءة الملف",true); reject(new Error("FileReader error")); };
    reader.readAsDataURL(file);
  });
}

      PARA_KEYS.forEach(k=>{
        if(!m.paras[k])m.paras[k]={topic:"",leaders_a:[],leaders_b:[]};
        const topicEl=document.getElementById(`tl-topic-${mid}-${k}`);
        const ldrsEl=document.getElementById(`tl-ldrs-${mid}-${k}`);
        if(topicEl) m.paras[k].topic=topicEl.value;
        if(ldrsEl){
          const selected=Array.from(ldrsEl.selectedOptions).map(o=>parseInt(o.value));
          setTeamLeaders(m.paras[k],CU.cls,selected);
          // keep combined leaders array for display
          m.paras[k].leaders=allParaLeaders(m.paras[k]);
        }
      });
      // post to sheet: update meeting row with new merged format (19 cols)
      sheetPost({sheet:"خطة الاجتماعات",action:"update",match:`اجتماع ${m.num}`,
        row:[
          `اجتماع ${m.num}`, m.date,
          lName(m.responsible_a), lName(m.responsible_b),
          ...PARA_KEYS.map(k=>m.paras[k]?.topic||""),
          ...PARA_KEYS.map(k=>lNamesArr(m.paras[k]?.leaders_a||[])),
          ...PARA_KEYS.map(k=>lNamesArr(m.paras[k]?.leaders_b||[]))
        ]
      });
      // visual feedback
      btn.textContent="✓ تم الحفظ";
      btn.style.background="var(--gm)";
      setTimeout(()=>{btn.textContent=`💾 حفظ توزيع اجتماع ${m.num}`;btn.style.background="";},2000);
      showSync("✓ تم حفظ توزيع اجتماع "+m.num);
      rAsPlan();
    });
  });
}

function readPdfAsBase64(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=e=>res(e.target.result); // data:application/pdf;base64,...
    r.onerror=rej;
    r.readAsDataURL(file);
  });
}

          <div class="fg"><label style="color:var(--g)">المسئول العام — فريق ب</label>

          </div>
        </div>
        <div style="font-size:12px;font-weight:700;color:var(--g);margin-bottom:8px;margin-top:4px">فقرات الاجتماع:</div>
        ${paraRows}`,
        ()=>{
          const matchKey=`اجتماع ${m.num}`;
          const changes=[];
          // date
          const nDate=document.getElementById("em-dt").value;
          if(nDate!==m.date) changes.push({col:"التاريخ",value:nDate});

          const nRespA=parseInt(document.getElementById("em-resp-a").value)||null;
          const nRespB=parseInt(document.getElementById("em-resp-b").value)||null;

          if(nRespB!==m.responsible_b) changes.push({col:"مسئول ب",value:lName(nRespB)});
          // paras — map key to column names
          const PARA_COLS_NAMES={
            spiritual:["روحية-موضوع","روحية-قائد أ","روحية-قائد ب"],
            scout:    ["كشفية-موضوع","كشفية-قائد أ","كشفية-قائد ب"],

            other:    ["أخرى-موضوع",  "أخرى-قائد أ",  "أخرى-قائد ب"]
          };
          // update num
          m.num=parseInt(document.getElementById("em-nu").value);
          m.date=nDate;
          m.responsible_a=nRespA;
          m.responsible_b=nRespB;
          PARA_KEYS.forEach(k=>{
            if(!m.paras[k])m.paras[k]={};
            const oldTopic=m.paras[k].topic||"";
            const oldA=JSON.stringify(m.paras[k].leaders_a||[]);
            const oldB=JSON.stringify(m.paras[k].leaders_b||[]);
            const nTopic=document.getElementById(`ep-topic-${k}`).value;
            const nLdrsA=Array.from(document.getElementById(`ep-ldrs-a-${k}`).selectedOptions).map(o=>parseInt(o.value));
            const nLdrsB=Array.from(document.getElementById(`ep-ldrs-b-${k}`).selectedOptions).map(o=>parseInt(o.value));
            const cols=PARA_COLS_NAMES[k];
            if(nTopic!==oldTopic)           changes.push({col:cols[0],value:nTopic});
            if(JSON.stringify(nLdrsA)!==oldA) changes.push({col:cols[1],value:lNamesArr(nLdrsA)});
            if(JSON.stringify(nLdrsB)!==oldB) changes.push({col:cols[2],value:lNamesArr(nLdrsB)});
            m.paras[k].topic=nTopic;
            m.paras[k].leaders_a=nLdrsA;
            m.paras[k].leaders_b=nLdrsB;
            m.paras[k].leaders=allParaLeaders(m.paras[k]);
          });
          closeModal();rAdPlan();
          if(changes.length) sheetPatch("خطة الاجتماعات",matchKey,changes);
          showSync("✓ تم تحديث الاجتماع");
        }
      );
    });
  });
  c.querySelectorAll(".meet-del-btn").forEach(btn=>{
    btn.addEventListener("click",()=>{if(!confirm("حذف؟"))return;DATA.meetings=DATA.meetings.filter(m=>m.id!=btn.dataset.mid);rAdPlan();});
  });
  // activities
  c.querySelectorAll(".act-edit-btn").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const a=DATA.activities.find(x=>x.id==btn.dataset.aid);if(!a)return;
      openModal("تعديل نشاط",
        `<div class="fr"><div class="fg"><label>الاسم</label><input type="text" id="ea-n" value="${a.name}"></div><div class="fg"><label>التاريخ</label><input type="date" id="ea-d" value="${a.date||""}"></div></div>`,
        ()=>{
          const oldName=a.name;
          const nName=document.getElementById("ea-n").value.trim();
          const nDate=document.getElementById("ea-d").value;
          const changes=[];
          if(nName!==a.name) changes.push({col:"الاسم",value:nName});
          if(nDate!==a.date) changes.push({col:"التاريخ",value:nDate});
          a.name=nName;a.date=nDate;
          closeModal();rAdPlan();
          if(changes.length) sheetPatch("الأنشطة",oldName,changes);
        }
      );
    });
  });
  c.querySelectorAll(".act-del-btn").forEach(btn=>{
    btn.addEventListener("click",()=>{if(!confirm("حذف؟"))return;DATA.activities=DATA.activities.filter(x=>x.id!=btn.dataset.aid);rAdPlan();});
  });
  // Admin PDF upload
  c.querySelectorAll(".ad-pdf-input").forEach(inp=>{
    inp.addEventListener("change",async()=>{
      const file=inp.files[0];if(!file)return;
      if(file.size>10*1024*1024){alert("الملف أكبر من 10MB");return;}
      const a=DATA.activities.find(x=>x.id==inp.dataset.aid);if(!a)return;
      const team=inp.dataset.team; // "a" or "b"
      const teamLabel=team==="a"?"ملايكة أ":"ملايكة ب";
      const pdfKey=team==="a"?"pdf_a":"pdf_b";
      try{
        const viewUrl=await uploadPdfToDrive(file, a.name, teamLabel);
        a[pdfKey]=viewUrl;
        rAdPlan();
      }catch(e){ console.error("Admin PDF upload failed",e); }
    });
  });
}
function addMeeting(){

    h+=`<tr><td><b>${ch.name}</b></td><td>${ch.cls}</td><td>${lName(ch.lid)}</td><td>${ch.phone||"—"}</td><td>${fDate(ch.dob)}</td>

        ()=>{
          const oldName=ch.name; const oldCls=ch.cls;
          const nName=document.getElementById("ech-n").value.trim();
          const nPhone=document.getElementById("ech-p").value.trim();
          const nAddr=document.getElementById("ech-a").value.trim();
          const nDob=document.getElementById("ech-d").value;
          const nCls=document.getElementById("ech-c").value;
          const nLid=parseInt(document.getElementById("ech-l").value)||0;
          // col names match sheet headers: الاسم, العنوان, تاريخ الميلاد, تليفون الام, القائد المسئول
          const changes=[];
          if(nName!==ch.name)   changes.push({col:"الاسم",value:nName});
          if(nPhone!==ch.phone) changes.push({col:"تليفون الام",value:nPhone});
          if(nAddr!==ch.addr)   changes.push({col:"العنوان",value:nAddr});
          if(nDob!==ch.dob)     changes.push({col:"تاريخ الميلاد",value:nDob});
          if(nLid!==ch.lid)     changes.push({col:"القائد المسئول",value:lName(nLid)});
          ch.name=nName;ch.phone=nPhone;ch.addr=nAddr;ch.dob=nDob;ch.cls=nCls;ch.lid=nLid;
          closeModal();rAdChildren();
          if(changes.length) sheetPatch(oldCls,oldName,changes);
        }
      );

      DATA.children=DATA.children.filter(c=>c.id!=btn.dataset.cid);

      showSync("✓ تم حذف الطفل");
    });
  });

function addChild(){

  });
  c.querySelectorAll(".ldr-del-btn").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const l=DATA.leaders.find(l=>l.id==btn.dataset.lid);
      if(!confirm(`حذف القائد "${l?.name}"؟`))return;
      DATA.leaders=DATA.leaders.filter(l=>l.id!=btn.dataset.lid);
      if(l) sheetPost({sheet:"القادة",action:"delete",match:l.name});
      rAdLeaders();
      showSync("✓ تم حذف القائد");
    });
  });
}
function addLeader(){
  const name=document.getElementById("nl-nm").value;if(!name){alert("ادخل الاسم");return;}
  const l={id:nxtId(DATA.leaders),name,phone:document.getElementById("nl-ph").value,dob:document.getElementById("nl-db").value,cls:document.getElementById("nl-cl").value};
  DATA.leaders.push(l);rAdLeaders();
  sheetPost({sheet:"القادة",row:[l.name,l.cls,l.phone,l.dob]});
}

function rAdLatt(){
  const c=document.getElementById("tab-ad-latt");
  const lastM=DATA.meetings[DATA.meetings.length-1];const mid=lastM?.id||0;
  let h='<h2 class="sec-title">حضور القادة</h2>';
  if(DATA.meetings.length)h+=`<div class="card" style="margin-bottom:11px"><label class="lbl">الاجتماع:</label>
    <select class="fi" style="margin-bottom:0" id="ad-la-sel">${DATA.meetings.map(m=>`<option value="${m.id}"${m.id==mid?" selected":""}>اجتماع ${m.num} — ${fDate(m.date)}</option>`).join("")}</select></div>`;
  if(!DATA.leaders.length)h+='<div class="empty-state"><div class="ei">👥</div>لم يُضف قادة بعد</div>';
  DATA.leaders.forEach(l=>{
    const key=`la_${mid}_${l.id}`,st=DATA.latt[key]||"",uni=DATA.latt[key+"_u"]||false;
    h+=`<div class="latt-row">
      <div class="latt-name">${l.name} <span class="badge bg-gray">${l.cls}</span></div>
      <div class="latt-ctrl">
        <button class="st-btn${st==="present"?" sp":""}" data-key="${key}" data-lid="${l.id}" data-st="present">حضر ✓</button>
        <button class="st-btn${st==="excused"?" se":""}" data-key="${key}" data-lid="${l.id}" data-st="excused">بعذر</button>
        <button class="st-btn${st==="absent"?" sa":""}" data-key="${key}" data-lid="${l.id}" data-st="absent">بدون عذر</button>
        <label class="uni-tog"><input type="checkbox"${uni?" checked":""} data-ukey="${key}_u"> بزي</label>
      </div>
      <textarea class="notes" style="margin-top:7px" placeholder="ملاحظات..." data-nkey="${key}_n">${DATA.latt[key+"_n"]||""}</textarea>
    </div>`;
  });
  c.innerHTML=h;
  c.querySelectorAll(".st-btn[data-lid]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const key=btn.dataset.key,st=btn.dataset.st,lid=parseInt(btn.dataset.lid);
      DATA.latt[key]=st;
      btn.closest(".latt-ctrl").querySelectorAll(".st-btn").forEach(b=>b.classList.remove("sp","se","sa"));
      btn.classList.add({present:"sp",excused:"se",absent:"sa"}[st]);
      const l=DATA.leaders.find(l=>l.id===lid);
      sheetPost({sheet:"حضور القادة",row:[new Date().toLocaleDateString("ar-EG"),l?.name||lid,{present:"حضر",excused:"بعذر",absent:"بدون عذر"}[st],DATA.latt[key+"_u"]?"بزي":"بدون زي",""]});
    });
  });
  c.querySelectorAll("input[data-ukey]").forEach(cb=>{cb.addEventListener("change",()=>{DATA.latt[cb.dataset.ukey]=cb.checked;});});
  c.querySelectorAll("textarea[data-nkey]").forEach(ta=>{ta.addEventListener("change",()=>{DATA.latt[ta.dataset.nkey]=ta.value;});});
}

function rPasswords(){
  const c=document.getElementById("tab-ad-passwords");
  let h=`<h2 class="sec-title">إدارة كلمات السر</h2>
  <div class="add-form"><h3>➕ إضافة / تعديل كلمة سر</h3>
    <div class="fr fr3">
      <div class="fg"><label>الدور</label><select id="np-role" class="fi" style="margin-bottom:0">
        <option value="قائد القطاع">قائد القطاع</option>
        <option value="قائد الفريق">قائد الفريق</option>
        <option value="مساعد قائد">مساعد قائد</option>
      </select></div>
      <div class="fg"><label>الفريق</label><select id="np-cls" class="fi" style="margin-bottom:0">
        <option value="">— لا ينطبق —</option>
        <option value="ملايكة أ">ملايكة أ</option>
        <option value="ملايكة ب">ملايكة ب</option>
      </select></div>
      <div class="fg"><label>كلمة السر</label><input type="text" id="np-pass" placeholder="اكتب كلمة السر"></div>
    </div>
    <div style="margin-top:9px"><button class="sv-btn" onclick="savePass()">حفظ في الشيت</button></div>
  </div>`;
  if(!DATA.passwords.length)h+='<div class="empty-state"><div class="ei">🔒</div>لم تُضف كلمات سر — الافتراضي للأدمن: <b>Jesus2026</b></div>';
  else{
    h+='<div class="tw"><table><thead><tr><th>الدور</th><th>الفريق</th><th>كلمة السر</th><th></th></tr></thead><tbody>';
    DATA.passwords.forEach((p,i)=>{
      h+=`<tr><td><b>${p.role}</b></td><td>${p.cls||"—"}</td>
      <td><code style="background:var(--gf);padding:2px 8px;border-radius:4px">${p.password}</code></td>
      <td><button class="ab ab-r pass-del-btn" data-idx="${i}">حذف</button></td></tr>`;
    });
    h+='</tbody></table></div>';
  }
  c.innerHTML=h;
  c.querySelectorAll(".pass-del-btn").forEach(btn=>{
    btn.addEventListener("click",()=>{
      if(!confirm("حذف كلمة السر؟"))return;
      DATA.passwords.splice(parseInt(btn.dataset.idx),1);
      rPasswords();
    });
  });
}
function savePass(){
  const role=document.getElementById("np-role").value,cls=document.getElementById("np-cls").value,pass=document.getElementById("np-pass").value.trim();
  if(!pass){alert("ادخل كلمة السر");return;}
  const ex=DATA.passwords.find(p=>p.role===role&&p.cls===cls);
  if(ex)ex.password=pass;else DATA.passwords.push({role,cls,password:pass});
  sheetPost({sheet:"كلمات السر",row:[role,cls,pass]});
  rPasswords();
}

function checkBdays(){
  const today=new Date(),mm=String(today.getMonth()+1).padStart(2,'0'),dd=String(today.getDate()).padStart(2,'0');
  const b=DATA.leaders.find(l=>l.dob&&l.dob.slice(5)===`${mm}-${dd}`);
  if(b){document.getElementById("bday-nm").textContent=b.name;document.getElementById("bday-banner").style.display="block";}
}
function rBdays(){
  const c=document.getElementById("tab-ad-birthdays");
  const today=new Date(),mm=String(today.getMonth()+1).padStart(2,'0'),dd=String(today.getDate()).padStart(2,'0');
  if(!DATA.leaders.length){c.innerHTML='<div class="empty-state"><div class="ei">🎂</div>لم يُضف قادة بعد</div>';return;}
  let byM={};
  DATA.leaders.forEach(l=>{if(!l.dob)return;const m=parseInt(l.dob.split("-")[1])-1;if(!byM[m])byM[m]=[];byM[m].push(l);});
  let h='<h2 class="sec-title">أعياد ميلاد القادة</h2>';
  for(let i=0;i<12;i++){
    if(!byM[i])continue;
    h+=`<div style="margin-bottom:16px"><div class="mo-title">🗓 ${MONTHS[i]}</div>`;
    byM[i].forEach(l=>{
      const isT=l.dob&&l.dob.slice(5)===`${mm}-${dd}`;
      h+=`<div class="bday-item${isT?" bday-today":""}"><div class="bday-av">${l.name[0]}</div><div style="flex:1;font-size:14px;font-weight:700">${l.name}${isT?" 🎂":""}</div><div style="font-size:12px;color:var(--mu)">${fDate(l.dob)}</div><span class="badge${isT?" bg-a":" bg-g"}">${isT?"اليوم!":l.cls}</span></div>`;
    });
    h+='</div>';
  }
  c.innerHTML=h;
}

function rReports(prefix){
  const scope=prefix==="tl"?myKids():DATA.children;
  const scopeLdrs=prefix==="tl"?myLdrs():DATA.leaders;
  const c=document.getElementById(`tab-${prefix}-reports`);
  const total=scope.length,done=scope.filter(ch=>DATA.followup["f_"+ch.id]==="done").length,pct=total?Math.round(done/total*100):0;
  const lastM=DATA.meetings[DATA.meetings.length-1];
  let pr=0,ex=0,ab=0;
  scope.forEach(ch=>{const s=DATA.attendance[`att_${lastM?.id||0}_${ch.id}`];if(s==="present")pr++;else if(s==="excused")ex++;else if(s==="absent")ab++;});
  let h=`<h2 class="sec-title">التقارير${prefix==="tl"?` — ${CU.cls}`:""}</h2>
  <div class="stats-grid">
    <div class="stat-box"><div class="stat-num">${total}</div><div class="stat-lbl">إجمالي الأولاد</div></div>
    <div class="stat-box"><div class="stat-num">${done}/${total}</div><div class="stat-lbl">تم افتقادهم</div><div class="prog"><div class="prog-fill" style="width:${pct}%"></div></div></div>
    <div class="stat-box"><div class="stat-num" style="color:var(--g)">${pr}</div><div class="stat-lbl">حضروا</div></div>
    <div class="stat-box"><div class="stat-num" style="color:var(--am)">${ex}</div><div class="stat-lbl">بعذر</div></div>
    <div class="stat-box"><div class="stat-num" style="color:var(--rd)">${ab}</div><div class="stat-lbl">بدون عذر</div></div>
    <div class="stat-box"><div class="stat-num">${scopeLdrs.length}</div><div class="stat-lbl">القادة</div></div>
  </div>`;
  if(scopeLdrs.length){
    h+='<div class="card"><div style="font-size:14px;font-weight:700;margin-bottom:11px">افتقاد الأولاد — كل قائد</div><div class="tw"><table><thead><tr><th>القائد</th><th>الفصل</th><th>الأولاد</th><th>تم</th><th>النسبة</th></tr></thead><tbody>';
    scopeLdrs.forEach(l=>{
      const kids=DATA.children.filter(c=>c.lid==l.id);
      const d=kids.filter(c=>DATA.followup["f_"+c.id]==="done").length;
      const p=kids.length?Math.round(d/kids.length*100):0;
      h+=`<tr><td><b>${l.name}</b></td><td>${l.cls}</td><td>${kids.length}</td><td>${d}</td><td><div style="display:flex;align-items:center;gap:7px"><div class="prog" style="flex:1;min-width:50px"><div class="prog-fill" style="width:${p}%"></div></div><b style="font-size:11px;color:var(--g)">${p}%</b></div></td></tr>`;
    });
    h+='</tbody></table></div></div>';
    // Leaders visitation
    const lvLdrs=prefix==="ad"?DATA.leaders:scopeLdrs;
    const lvDone=lvLdrs.filter(l=>DATA.lvisit["lv_"+l.id]==="done").length;
    const lvPct=lvLdrs.length?Math.round(lvDone/lvLdrs.length*100):0;
    h+=`<div class="card" style="margin-top:14px"><div style="font-size:14px;font-weight:700;margin-bottom:11px">افتقاد القادة 👥</div>
    <div style="display:flex;justify-content:space-between;margin-bottom:7px"><span style="font-size:13px;color:var(--mu)">الإجمالي</span><b style="color:var(--g)">${lvDone}/${lvLdrs.length} (${lvPct}%)</b></div>
    <div class="prog" style="margin-bottom:14px"><div class="prog-fill" style="width:${lvPct}%"></div></div>
    <div class="tw"><table><thead><tr><th>القائد</th><th>الفصل</th><th>الحالة</th><th>ملاحظات</th></tr></thead><tbody>`;
    lvLdrs.forEach(l=>{
      const st=DATA.lvisit["lv_"+l.id]||"",nt=DATA.lvisit["lv_"+l.id+"_n"]||"";
      h+=`<tr><td><b>${l.name}</b></td><td>${l.cls}</td><td><span class="badge ${st==="done"?"bg-g":"bg-r"}">${st==="done"?"تم ✓":"لم يتم"}</span></td><td style="font-size:12px;color:var(--mu)">${nt||"—"}</td></tr>`;
    });
    h+='</tbody></table></div>';
    if(prefix==="ad"){
      h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px">';
      ["ملايكة أ","ملايكة ب"].forEach(cls=>{
        const cl=DATA.leaders.filter(l=>l.cls===cls||l.cls==="كلا الفصلين");
        const cd=cl.filter(l=>DATA.lvisit["lv_"+l.id]==="done").length;
        const cp=cl.length?Math.round(cd/cl.length*100):0;
        h+=`<div class="stat-box"><div style="font-size:13px;font-weight:700;margin-bottom:7px">${cls}</div><div class="stat-num" style="font-size:20px">${cd}/${cl.length}</div><div class="stat-lbl">قادة تم افتقادهم</div><div class="prog"><div class="prog-fill" style="width:${cp}%"></div></div></div>`;
      });
      h+='</div>';
    }
    h+='</div>';
  }
  c.innerHTML=h;
}

  await loadAll();

});
