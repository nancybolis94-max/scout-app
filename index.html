<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قطاع الملايكة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --green:#2D6A4F;--green-mid:#40916C;--green-light:#74C69D;
  --green-pale:#D8F3DC;--green-faint:#F0FAF3;
  --amber:#E9A919;--amber-pale:#FFF3CD;
  --red:#C0392B;--red-pale:#FDECEA;
  --blue:#2563EB;--blue-pale:#EFF6FF;
  --text:#1A2E22;--text-mid:#3D5A47;--text-muted:#7A9585;
  --border:#C8E6D0;--bg:#F4FAF6;
  --radius:10px;--shadow:0 1px 4px rgba(45,106,79,0.10);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:15px}
.screen{display:none;min-height:100vh}
.screen.active{display:flex;flex-direction:column}

/* LOGIN */
#screen-login{align-items:center;justify-content:center;background:linear-gradient(160deg,#1B4332 0%,#2D6A4F 60%,#40916C 100%)}
.login-box{background:white;border-radius:20px;padding:40px 36px;width:100%;max-width:440px;box-shadow:0 8px 32px rgba(0,0,0,0.18)}
.login-logo{text-align:center;margin-bottom:24px}
.logo-icon{width:64px;height:64px;background:var(--green-pale);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;margin-bottom:10px}
.login-logo h1{font-size:22px;font-weight:700;color:var(--green)}
.login-logo p{font-size:13px;color:var(--text-muted);margin-top:4px}
.login-label{font-size:13px;font-weight:600;color:var(--text-mid);margin-bottom:6px;display:block}
.login-select,.login-input{width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:var(--radius);font-family:'Cairo',sans-serif;font-size:14px;color:var(--text);background:white;margin-bottom:14px;outline:none}
.login-select:focus,.login-input:focus{border-color:var(--green-mid)}
.role-tabs{display:flex;gap:8px;margin-bottom:18px}
.role-tab{flex:1;padding:10px 6px;border:2px solid var(--border);border-radius:var(--radius);background:white;font-family:'Cairo',sans-serif;font-size:13px;font-weight:600;cursor:pointer;color:var(--text-muted);transition:all .15s;text-align:center}
.role-tab.active{border-color:var(--green);background:var(--green-faint);color:var(--green)}
.login-btn{width:100%;padding:13px;background:var(--green);color:white;border:none;border-radius:var(--radius);font-family:'Cairo',sans-serif;font-size:16px;font-weight:700;cursor:pointer}
.login-btn:hover{background:var(--green-mid)}
.login-error{color:var(--red);font-size:13px;text-align:center;margin-bottom:10px;display:none}

/* HEADER */
.app-header{background:var(--green);color:white;padding:0 20px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,0.12)}
.header-info .title{font-size:16px;font-weight:700}
.header-info .sub{font-size:11px;opacity:.75}
.header-right{display:flex;align-items:center;gap:8px}
.role-badge{background:rgba(255,255,255,0.2);padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.logout-btn{background:rgba(255,255,255,0.15);border:none;color:white;padding:6px 14px;border-radius:20px;font-family:'Cairo',sans-serif;font-size:13px;cursor:pointer}
.birthday-banner{background:var(--amber);color:#5C3D00;padding:8px 20px;font-size:13px;font-weight:600;display:none;text-align:center}

/* TABS */
.tabs-bar{display:flex;background:white;border-bottom:2px solid var(--border);padding:0 16px;overflow-x:auto;position:sticky;top:56px;z-index:90}
.tab-btn{padding:13px 14px;font-family:'Cairo',sans-serif;font-size:13px;font-weight:600;border:none;background:none;cursor:pointer;color:var(--text-muted);white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-2px;transition:all .15s}
.tab-btn.active{color:var(--green);border-bottom-color:var(--green)}
.tab-content{display:none;padding:20px;max-width:980px;margin:0 auto;width:100%}
.tab-content.active{display:block}

/* CARDS & LAYOUT */
.card{background:white;border-radius:14px;box-shadow:var(--shadow);padding:20px;margin-bottom:16px;border:1px solid var(--border)}
.section-title{font-size:16px;font-weight:700;color:var(--green);margin-bottom:16px;padding-bottom:10px;border-bottom:2px solid var(--green-pale);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.badge{font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px}
.badge-green{background:var(--green-pale);color:var(--green)}
.badge-amber{background:var(--amber-pale);color:#7A5000}
.badge-red{background:var(--red-pale);color:var(--red)}
.badge-blue{background:var(--blue-pale);color:var(--blue)}
.badge-gray{background:#f0f0f0;color:#666}

/* MEETING PLAN */
.meeting-card{background:white;border-radius:14px;box-shadow:var(--shadow);border:1px solid var(--border);margin-bottom:14px;overflow:hidden}
.meeting-header{background:var(--green-faint);padding:12px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:8px}
.meeting-num{font-size:15px;font-weight:700;color:var(--green)}
.meeting-date{font-size:13px;color:var(--text-muted);font-weight:600}
.meeting-responsible{font-size:12px;color:var(--text-mid);background:var(--green-pale);padding:3px 10px;border-radius:20px}
.meeting-body{padding:14px 18px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.para-item{padding:10px 14px;border-radius:8px;border:1.5px solid var(--border);background:var(--bg)}
.para-item.mine{border-color:var(--amber);background:var(--amber-pale)}
.para-item.unassigned{border-color:#ddd;background:#fafafa}
.para-label{font-size:11px;font-weight:600;color:var(--text-muted);margin-bottom:2px}
.para-topic{font-size:12px;color:var(--text-mid);margin-bottom:3px;font-style:italic}
.para-leader{font-size:13px;font-weight:700;color:var(--text)}
.para-item.mine .para-leader{color:#7A5000}

/* CHILDREN / ROWS */
.child-row{background:white;border-radius:12px;box-shadow:var(--shadow);border:1px solid var(--border);padding:14px 16px;margin-bottom:10px}
.child-row-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.child-name{font-size:15px;font-weight:700}
.child-info{font-size:12px;color:var(--text-muted);margin-bottom:10px;line-height:1.8}
.status-btns{display:flex;gap:7px;margin-bottom:10px;flex-wrap:wrap}
.status-btn{padding:7px 14px;border-radius:20px;border:1.5px solid var(--border);background:white;font-family:'Cairo',sans-serif;font-size:12px;font-weight:600;cursor:pointer;color:var(--text-muted);transition:all .15s}
.status-btn.s-present,.status-btn.s-done{background:var(--green-pale);border-color:var(--green-light);color:var(--green)}
.status-btn.s-excused{background:var(--amber-pale);border-color:var(--amber);color:#7A5000}
.status-btn.s-absent,.status-btn.s-pending{background:var(--red-pale);border-color:var(--red);color:var(--red)}
.notes-input{width:100%;padding:8px 12px;border:1.5px solid var(--border);border-radius:8px;font-family:'Cairo',sans-serif;font-size:13px;color:var(--text);resize:vertical;min-height:50px;outline:none}
.notes-input:focus{border-color:var(--green-mid)}

/* TABLES */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--green-faint);padding:10px 12px;text-align:right;font-weight:700;color:var(--green);border-bottom:2px solid var(--border);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:hover td{background:var(--green-faint)}
.action-btns{display:flex;gap:6px;flex-wrap:nowrap}
.act-btn{padding:5px 12px;border-radius:20px;border:none;font-family:'Cairo',sans-serif;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
.act-btn-green{background:var(--green-pale);color:var(--green)}
.act-btn-amber{background:var(--amber-pale);color:#7A5000}
.act-btn-red{background:var(--red-pale);color:var(--red)}

/* FORMS */
.add-form{background:var(--green-faint);border:1.5px solid var(--border);border-radius:12px;padding:18px;margin-bottom:20px}
.add-form h3{font-size:14px;font-weight:700;color:var(--green);margin-bottom:14px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.form-row.triple{grid-template-columns:1fr 1fr 1fr}
.form-row.single{grid-template-columns:1fr}
.form-group label{display:block;font-size:12px;font-weight:600;color:var(--text-mid);margin-bottom:4px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;font-family:'Cairo',sans-serif;font-size:13px;color:var(--text);background:white;outline:none}
.form-group input:focus,.form-group select:focus{border-color:var(--green-mid)}
.save-btn{background:var(--green);color:white;border:none;border-radius:8px;padding:10px 22px;font-family:'Cairo',sans-serif;font-size:14px;font-weight:700;cursor:pointer;margin-left:8px}
.cancel-btn{background:#f0f0f0;color:#666;border:none;border-radius:8px;padding:10px 22px;font-family:'Cairo',sans-serif;font-size:14px;font-weight:600;cursor:pointer}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:500;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.open{display:flex}
.modal{background:white;border-radius:16px;padding:28px;width:100%;max-width:520px;box-shadow:0 8px 32px rgba(0,0,0,0.2);max-height:90vh;overflow-y:auto}
.modal-title{font-size:17px;font-weight:700;color:var(--green);margin-bottom:20px}
.modal-footer{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}

/* STATS */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px}
.stat-box{background:white;border-radius:12px;padding:16px;box-shadow:var(--shadow);border:1px solid var(--border);text-align:center}
.stat-num{font-size:28px;font-weight:700;color:var(--green);line-height:1}
.stat-label{font-size:12px;color:var(--text-muted);margin-top:5px}
.progress-bar{height:7px;border-radius:4px;background:var(--green-pale);margin-top:7px;overflow:hidden}
.progress-fill{height:100%;border-radius:4px;background:var(--green)}

/* BIRTHDAYS */
.month-title{font-size:13px;font-weight:700;color:var(--text-mid);margin-bottom:8px;padding:5px 12px;background:var(--green-faint);border-radius:8px;display:inline-block}
.bday-item{display:flex;align-items:center;gap:12px;padding:10px 14px;background:white;border-radius:10px;margin-bottom:8px;border:1px solid var(--border);box-shadow:var(--shadow)}
.bday-avatar{width:34px;height:34px;border-radius:50%;background:var(--green-pale);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--green);flex-shrink:0}
.bday-name{font-size:14px;font-weight:700;flex:1}
.bday-today{border-color:var(--amber);background:var(--amber-pale)}

/* ACTIVITIES */
.activity-card{display:flex;align-items:center;gap:14px;background:white;border-radius:12px;padding:14px 16px;margin-bottom:10px;border:1px solid var(--border);box-shadow:var(--shadow)}
.activity-icon{width:42px;height:42px;border-radius:10px;background:var(--green-pale);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.activity-info{flex:1}
.activity-name{font-size:14px;font-weight:700}
.activity-meta{font-size:12px;color:var(--text-muted);margin-top:2px}

/* LEADER ATT */
.leader-att-row{background:white;border-radius:12px;padding:14px 16px;margin-bottom:10px;border:1px solid var(--border)}
.la-name{font-size:14px;font-weight:700;margin-bottom:8px}
.la-controls{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.uniform-toggle{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-muted)}
.uniform-toggle input{accent-color:var(--green);width:15px;height:15px}

/* SYNC */
.sync-indicator{position:fixed;bottom:16px;left:16px;background:var(--green);color:white;padding:8px 16px;border-radius:20px;font-size:12px;font-weight:600;display:none;z-index:999;box-shadow:0 2px 8px rgba(0,0,0,0.2)}
.sync-indicator.error{background:var(--red)}

/* EMPTY STATE */
.empty-state{text-align:center;padding:40px 20px;color:var(--text-muted);font-size:14px}
.empty-state .icon{font-size:40px;margin-bottom:10px}

@media(max-width:600px){
  .meeting-body,.form-row,.form-row.triple{grid-template-columns:1fr}
  .stats-grid{grid-template-columns:repeat(2,1fr)}
  .tab-btn{padding:12px 10px;font-size:12px}
  .login-box{padding:28px 20px}
}
</style>
</head>
<body>
<div id="sync-indicator" class="sync-indicator">جاري الحفظ...</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal" id="modal-box">
    <div class="modal-title" id="modal-title"></div>
    <div id="modal-body"></div>
    <div class="modal-footer">
      <button class="cancel-btn" onclick="closeModal()">إلغاء</button>
      <button class="save-btn" id="modal-save-btn">حفظ</button>
    </div>
  </div>
</div>

<!-- LOGIN -->
<div id="screen-login" class="screen active">
  <div class="login-box">
    <div class="login-logo">
      <div class="logo-icon">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="#2D6A4F"><path d="M17 12h-5v5h5v-5zM16 1v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2h-1V1h-2zm3 18H5V8h14v11z"/></svg>

      <button class="role-tab" onclick="selectRole('assistant')" id="rt-assistant">مساعد قائد</button>
      <button class="role-tab active" onclick="selectRole('teamleader')" id="rt-teamleader">قائد الفريق</button>
      <button class="role-tab" onclick="selectRole('admin')" id="rt-admin">قائد القطاع</button>
    </div>
    <div id="lf-leader">
      <label class="login-label">الفصل:</label>
      <select class="login-select" id="sel-class">
        <option value="">-- اختار --</option>
        <option value="ملايكة أ">ملايكة أ</option>
        <option value="ملايكة ب">ملايكة ب</option>
      </select>
      <label class="login-label">اسمك:</label>
      <select class="login-select" id="sel-leader"><option value="">-- اختار الفصل أولاً --</option></select>
    </div>
    <div id="lf-admin" style="display:none">
      <label class="login-label">كلمة السر:</label>
      <input class="login-input" type="password" id="admin-pass" placeholder="كلمة السر">
    </div>
    <p class="login-error" id="login-error">بيانات غلط</p>
    <button class="login-btn" onclick="doLogin()">دخول</button>
  </div>
</div>

<!-- APP -->
<div id="screen-app" class="screen">
  <div class="birthday-banner" id="birthday-banner">🎂 عيد ميلاد سعيد يا <span id="bday-name-banner"></span>!</div>
  <div class="app-header">
    <div class="header-info">
      <div class="title" id="header-title">قطاع الملايكة</div>
      <div class="sub" id="header-sub"></div>
    </div>
    <div class="header-right">
      <span class="role-badge" id="role-badge"></span>
      <button class="logout-btn" onclick="doLogout()">خروج</button>
    </div>
  </div>

  <!-- ASSISTANT TABS -->
  <div id="tabs-assistant" style="display:none">
    <div class="tabs-bar">
      <button class="tab-btn active" onclick="showTab('a-plan','assistant')">خطة السنة</button>
      <button class="tab-btn" onclick="showTab('a-followup','assistant')">الافتقاد</button>
      <button class="tab-btn" onclick="showTab('a-activities','assistant')">الأنشطة</button>
      <button class="tab-btn" onclick="showTab('a-attendance','assistant')">الحضور</button>
    </div>
    <div id="tab-a-plan" class="tab-content active"></div>
    <div id="tab-a-followup" class="tab-content"></div>
    <div id="tab-a-activities" class="tab-content"></div>
    <div id="tab-a-attendance" class="tab-content"></div>
  </div>

  <!-- TEAM LEADER TABS -->
  <div id="tabs-teamleader" style="display:none">
    <div class="tabs-bar">
      <button class="tab-btn active" onclick="showTab('tl-plan','teamleader')">توزيع الخطة</button>
      <button class="tab-btn" onclick="showTab('tl-leaders-att','teamleader')">حضور القادة</button>
      <button class="tab-btn" onclick="showTab('tl-children-att','teamleader')">حضور الأولاد</button>
      <button class="tab-btn" onclick="showTab('tl-followup','teamleader')">الافتقاد</button>
      <button class="tab-btn" onclick="showTab('tl-activities','teamleader')">الأنشطة</button>
    </div>
    <div id="tab-tl-plan" class="tab-content active"></div>
    <div id="tab-tl-leaders-att" class="tab-content"></div>
    <div id="tab-tl-children-att" class="tab-content"></div>
    <div id="tab-tl-followup" class="tab-content"></div>
    <div id="tab-tl-activities" class="tab-content"></div>
  </div>

  <!-- ADMIN TABS -->
  <div id="tabs-admin" style="display:none">
    <div class="tabs-bar">
      <button class="tab-btn active" onclick="showTab('ad-plan','admin')">خطة الاجتماعات</button>
      <button class="tab-btn" onclick="showTab('ad-children','admin')">الأولاد</button>
      <button class="tab-btn" onclick="showTab('ad-leaders','admin')">القادة</button>
      <button class="tab-btn" onclick="showTab('ad-leaders-att','admin')">حضور القادة</button>
      <button class="tab-btn" onclick="showTab('ad-birthdays','admin')">أعياد الميلاد</button>
      <button class="tab-btn" onclick="showTab('ad-reports','admin')">التقارير</button>
    </div>
    <div id="tab-ad-plan" class="tab-content active"></div>
    <div id="tab-ad-children" class="tab-content"></div>
    <div id="tab-ad-leaders" class="tab-content"></div>
    <div id="tab-ad-leaders-att" class="tab-content"></div>
    <div id="tab-ad-birthdays" class="tab-content"></div>
    <div id="tab-ad-reports" class="tab-content"></div>
  </div>
</div>

<script>
// ===================== CONFIG =====================

// ===================== SYNC =====================
async function syncToSheet(sheetName, rowData) {
  const ind = document.getElementById("sync-indicator");
  ind.textContent = "جاري الحفظ..."; ind.className = "sync-indicator"; ind.style.display = "block";
  try {
    await fetch(APPS_SCRIPT_URL, { method:"POST", mode:"no-cors", headers:{"Content-Type":"application/json"}, body: JSON.stringify({sheet:sheetName, row:rowData}) });
    ind.textContent = "✓ تم الحفظ"; setTimeout(() => ind.style.display="none", 2000);
  } catch(e) {
    ind.textContent = "⚠ تعذر الحفظ"; ind.className = "sync-indicator error"; setTimeout(() => ind.style.display="none", 3000);
  }
}

// ===================== HELPERS =====================
function lName(id) { const l = DATA.leaders.find(l=>l.id==id); return l ? l.name : "غير محدد"; }
function fDate(d) { if(!d) return "—"; const p=d.split("-"); return p.length===3 ? `${p[2]}/${p[1]}/${p[0]}` : d; }
function nextId(arr) { return arr.length ? Math.max(...arr.map(x=>x.id))+1 : 1; }
function myLeaders() { return DATA.leaders.filter(l => l.cls === CU.cls || l.cls === "كلا الفصلين"); }
function myChildren() { return DATA.children.filter(c => c.cls === CU.cls); }
function ldrOptsFor(list) { return list.map(l=>`<option value="${l.id}">${l.name}</option>`).join(""); }
function allLdrOpts() { return DATA.leaders.map(l=>`<option value="${l.id}">${l.name} (${l.cls})</option>`).join(""); }
const PARA_KEYS = ["spiritual","scout","culture","game","other"];
const PARA_NAMES = {spiritual:"الروحية",scout:"الكشفية",culture:"الثقافية",game:"اللعبة",other:"فقرات أخرى"};

// ===================== LOGIN =====================
let currentRole = "teamleader";
function selectRole(r) {
  currentRole = r;
  ["assistant","teamleader","admin"].forEach(x => document.getElementById("rt-"+x).classList.toggle("active", x===r));
  document.getElementById("lf-leader").style.display = r==="admin" ? "none" : "block";
  document.getElementById("lf-admin").style.display = r==="admin" ? "block" : "none";
}
selectRole("teamleader");

document.getElementById("sel-class").addEventListener("change", function() {
  const cls = this.value;
  const sel = document.getElementById("sel-leader");
  const filtered = DATA.leaders.filter(l => l.cls===cls || l.cls==="كلا الفصلين");
  if (!filtered.length) { sel.innerHTML = '<option value="">لا يوجد قادة مسجلين بعد</option>'; return; }
  sel.innerHTML = '<option value="">-- اختار --</option>' + filtered.map(l=>`<option value="${l.id}">${l.name}</option>`).join("");
});

function doLogin() {
  const err = document.getElementById("login-error");
  err.style.display = "none";
  if (currentRole === "admin") {
    if (document.getElementById("admin-pass").value !== ADMIN_PASS) { err.textContent="كلمة السر غلط"; err.style.display="block"; return; }
    CU = { role:"admin", name:"قائد القطاع" };
  } else {
    const cls = document.getElementById("sel-class").value;
    const lid = document.getElementById("sel-leader").value;
    if (!cls||!lid) { err.textContent="اختار الفصل والاسم"; err.style.display="block"; return; }
    const leader = DATA.leaders.find(l=>l.id==lid);
    if (!leader) { err.textContent="القائد غير موجود"; err.style.display="block"; return; }
    CU = { role:currentRole, name:leader.name, id:leader.id, cls };
  }
  document.getElementById("screen-login").classList.remove("active");
  document.getElementById("screen-app").classList.add("active");
  initApp();
}

function doLogout() {
  CU = null;
  document.getElementById("screen-app").classList.remove("active");
  document.getElementById("screen-login").classList.add("active");
  document.getElementById("admin-pass").value = "";
  ["assistant","teamleader","admin"].forEach(r => { document.getElementById("tabs-"+r).style.display="none"; });
}

// ===================== INIT =====================
function initApp() {
  const roleLabels = {admin:"قائد القطاع", teamleader:"قائد الفريق", assistant:"مساعد قائد"};
  document.getElementById("header-title").textContent = CU.role==="admin" ? "لوحة تحكم الأدمن — قطاع الملايكة" : "قطاع الملايكة";
  document.getElementById("header-sub").textContent = CU.name + (CU.cls ? ` — ${CU.cls}` : "");
  document.getElementById("role-badge").textContent = roleLabels[CU.role];
  ["assistant","teamleader","admin"].forEach(r => { document.getElementById("tabs-"+r).style.display = CU.role===r ? "block" : "none"; });
  checkBirthdays();
  if (CU.role==="admin") { renderAdminPlan(); renderAdminChildren(); renderAdminLeaders(); renderAdminLeadersAtt(); renderBirthdays(); renderReports(); }
  else if (CU.role==="teamleader") { renderTLPlan(); renderTLLeadersAtt(); renderTLChildrenAtt(); renderTLFollowup(); renderActivities("tl"); }
  else { renderAssistantPlan(); renderAssistantFollowup(); renderActivities("a"); renderAssistantAttendance(); }
}

function showTab(name, role) {
  document.querySelectorAll(`#tabs-${role} .tab-content`).forEach(t=>t.classList.remove("active"));
  document.querySelectorAll(`#tabs-${role} .tab-btn`).forEach(t=>t.classList.remove("active"));
  document.getElementById("tab-"+name).classList.add("active");
  event.target.classList.add("active");
}

// ===================== ASSISTANT: PLAN =====================
function renderAssistantPlan() {
  const c = document.getElementById("tab-a-plan");
  if (!DATA.meetings.length) { c.innerHTML=`<div class="empty-state"><div class="icon">📅</div>لم تُضف اجتماعات بعد</div>`; return; }
  let html = `<h2 class="section-title">خطة اجتماعات السنة</h2>`;
  DATA.meetings.forEach(m => {
    html += `<div class="meeting-card"><div class="meeting-header">
      <span class="meeting-num">اجتماع ${m.num}</span>
      <span class="meeting-date">${fDate(m.date)}</span>
      <span class="meeting-responsible">المسئول العام: ${lName(m.responsible)}</span>
    </div><div class="meeting-body">`;
    PARA_KEYS.forEach(k => {
      if (!m.paras[k]) return;
      const mine = m.paras[k].leader_id == CU.id;
      html += `<div class="para-item ${mine?"mine":""}">
        <div class="para-label">${PARA_NAMES[k]}</div>
        <div class="para-topic">${m.paras[k].topic||"—"}</div>
        <div class="para-leader">${lName(m.paras[k].leader_id)}${mine?" ⭐":""}</div>
      </div>`;
    });
    html += `</div></div>`;
  });
  c.innerHTML = html;
}

// ===================== ASSISTANT: FOLLOWUP =====================
function renderAssistantFollowup() {
  const myKids = DATA.children.filter(c => c.leader_id==CU.id);
  const c = document.getElementById("tab-a-followup");
  if (!myKids.length) { c.innerHTML=`<div class="empty-state"><div class="icon">👦</div>لا يوجد أولاد مخصصين لك بعد</div>`; return; }
  let html = `<h2 class="section-title">الافتقاد <span class="badge badge-green">${myKids.length} طفل</span></h2>`;
  myKids.forEach(ch => {
    const key=`f_${ch.id}`, status=DATA.followup[key]||"", note=DATA.followup[key+"_note"]||"";
    html += `<div class="child-row">
      <div class="child-name">${ch.name}</div>
      <div class="child-info">📞 ${ch.phone||"—"} | 📍 ${ch.address||"—"} | 🎂 ${fDate(ch.dob)}</div>
      <div class="status-btns">
        <button class="status-btn ${status==="done"?"s-done":""}" onclick="setFollowup(${ch.id},'done',this)">تم الافتقاد ✓</button>
        <button class="status-btn ${status==="pending"?"s-pending":""}" onclick="setFollowup(${ch.id},'pending',this)">لم يتم</button>
      </div>
      <textarea class="notes-input" placeholder="ملاحظات..." onchange="DATA.followup['${key}_note']=this.value">${note}</textarea>
    </div>`;
  });
  c.innerHTML = html;
}
function setFollowup(cid, status, btn) {
  DATA.followup["f_"+cid] = status;
  btn.closest(".child-row").querySelectorAll(".status-btn").forEach(b=>b.className="status-btn");
  btn.classList.add(status==="done"?"s-done":"s-pending");
  const ch=DATA.children.find(c=>c.id===cid);
  syncToSheet("الافتقاد",[new Date().toLocaleDateString("ar-EG"),CU.name,ch?.name||cid,status==="done"?"تم":"لم يتم"]);
}

// ===================== ASSISTANT: ATTENDANCE =====================
function renderAssistantAttendance() {
  const myKids = DATA.children.filter(c => c.leader_id==CU.id);
  const c = document.getElementById("tab-a-attendance");
  if (!myKids.length) { c.innerHTML=`<div class="empty-state"><div class="icon">✅</div>لا يوجد أولاد مخصصين لك</div>`; return; }
  const lastM = DATA.meetings[DATA.meetings.length-1];
  let html = `<h2 class="section-title">الحضور والغياب <span class="badge badge-green">${myKids.length} طفل</span></h2>`;
  if (DATA.meetings.length) {
    html += `<div class="card" style="margin-bottom:14px"><label class="login-label">الاجتماع:</label>
    <select class="login-select" style="margin-bottom:0" id="att-meet-sel" onchange="renderAssistantAttendance()">
      ${DATA.meetings.map(m=>`<option value="${m.id}" ${m.id==lastM?.id?"selected":""}>اجتماع ${m.num} — ${fDate(m.date)}</option>`).join("")}
    </select></div>`;
  }
  const mid = document.getElementById("att-meet-sel")?.value || lastM?.id || 0;
  myKids.forEach(ch => {
    const key=`att_${mid}_${ch.id}`, status=DATA.attendance[key]||"", note=DATA.attendance[key+"_note"]||"";
    html += `<div class="child-row">
      <div class="child-name">${ch.name}</div>
      <div class="status-btns">
        <button class="status-btn ${status==="present"?"s-present":""}" onclick="setAtt('${key}','present',this,${ch.id},${mid})">حضر ✓</button>
        <button class="status-btn ${status==="excused"?"s-excused":""}" onclick="setAtt('${key}','excused',this,${ch.id},${mid})">بعذر</button>
        <button class="status-btn ${status==="absent"?"s-absent":""}" onclick="setAtt('${key}','absent',this,${ch.id},${mid})">بدون عذر</button>
      </div>
      <textarea class="notes-input" placeholder="ملاحظات..." onchange="DATA.attendance['${key}_note']=this.value">${note}</textarea>
    </div>`;
  });
  c.innerHTML = html;
}
function setAtt(key, status, btn, cid, mid) {
  DATA.attendance[key]=status;
  btn.closest(".child-row").querySelectorAll(".status-btn").forEach(b=>b.className="status-btn");
  btn.classList.add({present:"s-present",excused:"s-excused",absent:"s-absent"}[status]);
  const ch=DATA.children.find(c=>c.id===cid);
  const m=DATA.meetings.find(m=>m.id==mid);
  syncToSheet("حضور الأولاد",[new Date().toLocaleDateString("ar-EG"),m?`اجتماع ${m.num}`:"",ch?.name||cid,CU.name,{present:"حضر",excused:"بعذر",absent:"بدون عذر"}[status]]);
}

function setMeetResponsible(mid, lid) {
  const m = DATA.meetings.find(m=>m.id==mid);

  const m = DATA.meetings.find(m=>m.id==mid);

}
function setParaLeader(mid, key, val) {
  const m = DATA.meetings.find(m=>m.id==mid);

  renderAssistantPlan();
}
function saveTLPlan() {
  DATA.meetings.forEach(m => {

      const p = m.paras[k]||{};

}

  const clsOpts=["ملايكة أ","ملايكة ب","كلا الفصلين"].map(x=>`<option value="${x}" ${l.cls===x?"selected":""}>${x}</option>`).join("");
  openModal("تعديل بيانات: "+l.name,
    `<div class="form-row"><div class="form-group"><label>الاسم</label><input type="text" id="el-name" value="${l.name}"></div><div class="form-group"><label>الموبايل</label><input type="text" id="el-phone" value="${l.phone||""}"></div></div>
    <div class="form-row"><div class="form-group"><label>تاريخ الميلاد</label><input type="date" id="el-dob" value="${l.dob||""}"></div><div class="form-group"><label>الفصل</label><select id="el-cls">${clsOpts}</select></div></div>`,
    () => {
      l.name=document.getElementById("el-name").value;
      l.phone=document.getElementById("el-phone").value;
      l.dob=document.getElementById("el-dob").value;
      l.cls=document.getElementById("el-cls").value;
      closeModal(); renderAdminLeaders();
    }
  );
}

// ===================== ADMIN: LEADERS ATT =====================
function renderAdminLeadersAtt() {
  const c = document.getElementById("tab-ad-leaders-att");
  const lastM=DATA.meetings[DATA.meetings.length-1];
  let html=`<h2 class="section-title">حضور القادة</h2>`;
  if(DATA.meetings.length){
    html+=`<div class="card" style="margin-bottom:14px"><label class="login-label">الاجتماع:</label>
    <select class="login-select" style="margin-bottom:0" id="ad-la-meet-sel">
      ${DATA.meetings.map(m=>`<option value="${m.id}" ${m.id==lastM?.id?"selected":""}>اجتماع ${m.num} — ${fDate(m.date)}</option>`).join("")}
    </select></div>`;
  }
  if(!DATA.leaders.length){html+=`<div class="empty-state"><div class="icon">👥</div>لم يُضف قادة بعد</div>`;}
  DATA.leaders.forEach(l=>{
    const mid=lastM?.id||0,key=`la_${mid}_${l.id}`,status=DATA.leader_attendance[key]||"",uniform=DATA.leader_attendance[key+"_u"]||false;
    html+=`<div class="leader-att-row">
      <div class="la-name">${l.name} <span class="badge badge-gray">${l.cls}</span></div>
      <div class="la-controls">
        <button class="status-btn ${status==="present"?"s-present":""}" onclick="setLdrAtt('${key}',${l.id},'present',this)">حضر ✓</button>
        <button class="status-btn ${status==="excused"?"s-excused":""}" onclick="setLdrAtt('${key}',${l.id},'excused',this)">بعذر</button>
        <button class="status-btn ${status==="absent"?"s-absent":""}" onclick="setLdrAtt('${key}',${l.id},'absent',this)">بدون عذر</button>
        <label class="uniform-toggle"><input type="checkbox" ${uniform?"checked":""} onchange="DATA.leader_attendance['${key}_u']=this.checked"> بزي كشفي</label>
      </div>
      <textarea class="notes-input" style="margin-top:8px" placeholder="ملاحظات...">${DATA.leader_attendance[key+"_note"]||""}</textarea>
    </div>`;
  });
  c.innerHTML=html;
}

// ===================== BIRTHDAYS =====================
function checkBirthdays(){
  const today=new Date(),mm=String(today.getMonth()+1).padStart(2,'0'),dd=String(today.getDate()).padStart(2,'0');
  const b=DATA.leaders.find(l=>l.dob&&l.dob.slice(5)===`${mm}-${dd}`);
  if(b){document.getElementById("bday-name-banner").textContent=b.name;document.getElementById("birthday-banner").style.display="block";}
}
function renderBirthdays(){
  const c=document.getElementById("tab-ad-birthdays");
  const today=new Date(),mm=String(today.getMonth()+1).padStart(2,'0'),dd=String(today.getDate()).padStart(2,'0');
  const months=["يناير","فبراير","مارس","إبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
  if(!DATA.leaders.length){c.innerHTML=`<div class="empty-state"><div class="icon">🎂</div>لم يُضف قادة بعد</div>`;return;}
  let byMonth={};
  DATA.leaders.forEach(l=>{if(!l.dob)return;const m=parseInt(l.dob.split("-")[1])-1;if(!byMonth[m])byMonth[m]=[];byMonth[m].push(l);});
  let html=`<h2 class="section-title">أعياد ميلاد القادة</h2>`;
  for(let i=0;i<12;i++){
    if(!byMonth[i])continue;
    html+=`<div style="margin-bottom:20px"><div class="month-title">🗓 ${months[i]}</div>`;
    byMonth[i].forEach(l=>{
      const isToday=l.dob&&l.dob.slice(5)===`${mm}-${dd}`;
      html+=`<div class="bday-item ${isToday?"bday-today":""}"><div class="bday-avatar">${l.name[0]}</div><div class="bday-name">${l.name}${isToday?" 🎂":""}</div><div style="font-size:12px;color:var(--text-muted)">${fDate(l.dob)}</div><span class="badge ${isToday?"badge-amber":"badge-green"}">${isToday?"اليوم!":l.cls}</span></div>`;
    });
    html+=`</div>`;
  }
  c.innerHTML=html;
}

// ===================== REPORTS =====================
function renderReports(){
  const c=document.getElementById("tab-ad-reports");
  const total=DATA.children.length;
  const done=DATA.children.filter(ch=>DATA.followup["f_"+ch.id]==="done").length;
  const pct=total?Math.round(done/total*100):0;
  const lastM=DATA.meetings[DATA.meetings.length-1];
  let present=0,excused=0,absent=0;
  DATA.children.forEach(ch=>{const s=DATA.attendance[`att_${lastM?.id||0}_${ch.id}`];if(s==="present")present++;else if(s==="excused")excused++;else if(s==="absent")absent++;});
  let html=`<h2 class="section-title">تقارير القطاع</h2>
  <div class="stats-grid">
    <div class="stat-box"><div class="stat-num">${total}</div><div class="stat-label">إجمالي الأولاد</div></div>
    <div class="stat-box"><div class="stat-num">${done}/${total}</div><div class="stat-label">تم افتقادهم</div><div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div></div>
    <div class="stat-box"><div class="stat-num" style="color:var(--green)">${present}</div><div class="stat-label">حضروا</div></div>
    <div class="stat-box"><div class="stat-num" style="color:var(--amber)">${excused}</div><div class="stat-label">بعذر</div></div>
    <div class="stat-box"><div class="stat-num" style="color:var(--red)">${absent}</div><div class="stat-label">بدون عذر</div></div>
    <div class="stat-box"><div class="stat-num">${DATA.leaders.length}</div><div class="stat-label">القادة</div></div>
  </div>`;
  if(DATA.leaders.length){
    html+=`<div class="card"><div style="font-size:15px;font-weight:700;margin-bottom:14px">افتقاد كل قائد</div><div class="table-wrap"><table><thead><tr><th>القائد</th><th>الفصل</th><th>الأولاد</th><th>تم</th><th>النسبة</th></tr></thead><tbody>`;
    DATA.leaders.forEach(l=>{
      const kids=DATA.children.filter(c=>c.leader_id==l.id);
      const d=kids.filter(c=>DATA.followup["f_"+c.id]==="done").length;
      const p=kids.length?Math.round(d/kids.length*100):0;
      html+=`<tr><td><b>${l.name}</b></td><td>${l.cls}</td><td>${kids.length}</td><td>${d}</td><td><div style="display:flex;align-items:center;gap:8px"><div class="progress-bar" style="flex:1;min-width:60px"><div class="progress-fill" style="width:${p}%"></div></div><b style="font-size:12px;color:var(--green)">${p}%</b></div></td></tr>`;
    });
    html+=`</tbody></table></div></div>`;
  }
  html+=`<div class="card"><div style="font-size:15px;font-weight:700;margin-bottom:14px">حضور الأولاد — آخر اجتماع</div><div class="table-wrap"><table><thead><tr><th>الطفل</th><th>الفصل</th><th>القائد</th><th>الحالة</th></tr></thead><tbody>`;
  DATA.children.forEach(ch=>{
    const s=DATA.attendance[`att_${lastM?.id||0}_${ch.id}`]||"—";
    const labels={present:"حضر",excused:"بعذر",absent:"بدون عذر","—":"—"};
    const bgs={present:"badge-green",excused:"badge-amber",absent:"badge-red","—":"badge-gray"};
    html+=`<tr><td><b>${ch.name}</b></td><td>${ch.cls}</td><td>${lName(ch.leader_id)}</td><td><span class="badge ${bgs[s]}">${labels[s]}</span></td></tr>`;
  });
  html+=`</tbody></table></div></div>`;
  c.innerHTML=html;
}
</script>
</body>
</html>
