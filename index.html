<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قطاع الملايكة - Scout Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #2D6A4F; --green-mid: #40916C; --green-light: #74C69D;
    --green-pale: #D8F3DC; --green-faint: #F0FAF3;
    --amber: #E9A919; --amber-pale: #FFF3CD;
    --red: #C0392B; --red-pale: #FDECEA;
    --blue: #2563EB; --blue-pale: #EFF6FF;
    --text: #1A2E22; --text-mid: #3D5A47; --text-muted: #7A9585;
    --border: #C8E6D0; --surface: #FFFFFF; --bg: #F4FAF6;
    --radius: 10px; --shadow: 0 1px 4px rgba(45,106,79,0.10);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 15px; }
  .screen { display: none; min-height: 100vh; }
  .screen.active { display: flex; flex-direction: column; }

  /* LOGIN */
  #screen-login { align-items: center; justify-content: center; background: linear-gradient(160deg, #1B4332 0%, #2D6A4F 60%, #40916C 100%); }
  .login-box { background: white; border-radius: 20px; padding: 40px 36px; width: 100%; max-width: 420px; box-shadow: 0 8px 32px rgba(0,0,0,0.18); }
  .login-logo { text-align: center; margin-bottom: 28px; }
  .login-logo .logo-icon { width: 64px; height: 64px; background: var(--green-pale); border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 12px; }
  .login-logo h1 { font-size: 22px; font-weight: 700; color: var(--green); }
  .login-logo p { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
  .login-label { font-size: 13px; font-weight: 600; color: var(--text-mid); margin-bottom: 6px; display: block; }
  .login-select, .login-input { width: 100%; padding: 10px 14px; border: 1.5px solid var(--border); border-radius: var(--radius); font-family: 'Cairo', sans-serif; font-size: 14px; color: var(--text); background: white; margin-bottom: 16px; outline: none; }
  .login-select:focus, .login-input:focus { border-color: var(--green-mid); }
  .login-role-btns { display: flex; gap: 10px; margin-bottom: 20px; }
  .role-btn { flex: 1; padding: 12px; border: 2px solid var(--border); border-radius: var(--radius); background: white; font-family: 'Cairo', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; transition: all .18s; color: var(--text-muted); }
  .role-btn.active { border-color: var(--green); background: var(--green-faint); color: var(--green); }
  .login-btn { width: 100%; padding: 13px; background: var(--green); color: white; border: none; border-radius: var(--radius); font-family: 'Cairo', sans-serif; font-size: 16px; font-weight: 700; cursor: pointer; transition: background .18s; }
  .login-btn:hover { background: var(--green-mid); }
  .login-error { color: var(--red); font-size: 13px; text-align: center; margin-bottom: 12px; display: none; }
  .admin-pass-field { display: none; }

  /* APP SHELL */
  .app-header { background: var(--green); color: white; padding: 0 20px; height: 56px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,0.12); }
  .app-header-title { font-size: 16px; font-weight: 700; }
  .app-header-sub { font-size: 12px; opacity: .75; }
  .logout-btn { background: rgba(255,255,255,0.15); border: none; color: white; padding: 6px 14px; border-radius: 20px; font-family: 'Cairo', sans-serif; font-size: 13px; cursor: pointer; }
  .logout-btn:hover { background: rgba(255,255,255,0.25); }
  .birthday-banner { background: var(--amber); color: #5C3D00; padding: 8px 20px; font-size: 13px; font-weight: 600; display: none; text-align: center; }

  /* TABS */
  .tabs-bar { display: flex; background: white; border-bottom: 2px solid var(--border); padding: 0 20px; overflow-x: auto; position: sticky; top: 56px; z-index: 90; }
  .tab-btn { padding: 14px 16px; font-family: 'Cairo', sans-serif; font-size: 13px; font-weight: 600; border: none; background: none; cursor: pointer; color: var(--text-muted); white-space: nowrap; border-bottom: 3px solid transparent; margin-bottom: -2px; transition: all .18s; }
  .tab-btn.active { color: var(--green); border-bottom-color: var(--green); }
  .tab-content { display: none; padding: 20px; max-width: 960px; margin: 0 auto; width: 100%; }
  .tab-content.active { display: block; }

  /* CARDS */
  .card { background: white; border-radius: 14px; box-shadow: var(--shadow); padding: 20px; margin-bottom: 16px; border: 1px solid var(--border); }
  .section-title { font-size: 17px; font-weight: 700; color: var(--green); margin-bottom: 16px; padding-bottom: 10px; border-bottom: 2px solid var(--green-pale); display: flex; align-items: center; justify-content: space-between; }
  .badge { font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 20px; }
  .badge-green { background: var(--green-pale); color: var(--green); }
  .badge-amber { background: var(--amber-pale); color: #7A5000; }
  .badge-red { background: var(--red-pale); color: var(--red); }
  .badge-blue { background: var(--blue-pale); color: var(--blue); }

  /* MEETING PLAN */
  .meeting-card { background: white; border-radius: 14px; box-shadow: var(--shadow); border: 1px solid var(--border); margin-bottom: 14px; overflow: hidden; }
  .meeting-header { background: var(--green-faint); padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
  .meeting-date { font-size: 13px; color: var(--text-muted); font-weight: 600; }
  .meeting-num { font-size: 15px; font-weight: 700; color: var(--green); }
  .meeting-body { padding: 14px 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .para-item { padding: 10px 14px; border-radius: 8px; border: 1.5px solid var(--border); background: var(--bg); }
  .para-item.mine { border-color: var(--amber); background: var(--amber-pale); }
  .para-label { font-size: 11px; font-weight: 600; color: var(--text-muted); margin-bottom: 3px; }
  .para-leader { font-size: 13px; font-weight: 700; color: var(--text); }
  .para-item.mine .para-leader { color: #7A5000; }

  /* CHILDREN */
  .child-row { background: white; border-radius: 12px; box-shadow: var(--shadow); border: 1px solid var(--border); padding: 16px 18px; margin-bottom: 12px; }
  .child-name { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
  .child-info { font-size: 12px; color: var(--text-muted); margin-bottom: 10px; line-height: 1.8; }
  .status-btns { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .status-btn { padding: 7px 16px; border-radius: 20px; border: 1.5px solid var(--border); background: white; font-family: 'Cairo', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--text-muted); transition: all .15s; }
  .status-btn.s-done, .status-btn.s-present { background: var(--green-pale); border-color: var(--green-light); color: var(--green); }
  .status-btn.s-excused { background: var(--amber-pale); border-color: var(--amber); color: #7A5000; }
  .status-btn.s-absent { background: var(--red-pale); border-color: var(--red); color: var(--red); }
  .notes-input { width: 100%; padding: 8px 12px; border: 1.5px solid var(--border); border-radius: 8px; font-family: 'Cairo', sans-serif; font-size: 13px; color: var(--text); resize: vertical; min-height: 56px; outline: none; }
  .notes-input:focus { border-color: var(--green-mid); }

  /* TABLE */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { background: var(--green-faint); padding: 10px 14px; text-align: right; font-weight: 700; color: var(--green); border-bottom: 2px solid var(--border); white-space: nowrap; }
  td { padding: 10px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr:hover td { background: var(--green-faint); }
  .act-btn { padding: 5px 14px; border-radius: 20px; border: none; font-family: 'Cairo', sans-serif; font-size: 12px; font-weight: 600; cursor: pointer; }
  .act-btn-green { background: var(--green-pale); color: var(--green); }
  .act-btn-red { background: var(--red-pale); color: var(--red); }

  /* ADD FORM */
  .add-form { background: var(--green-faint); border: 1.5px solid var(--border); border-radius: 12px; padding: 18px; margin-bottom: 20px; }
  .add-form h3 { font-size: 14px; font-weight: 700; color: var(--green); margin-bottom: 14px; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  .form-row.triple { grid-template-columns: 1fr 1fr 1fr; }
  .form-group label { display: block; font-size: 12px; font-weight: 600; color: var(--text-mid); margin-bottom: 4px; }
  .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 9px 12px; border: 1.5px solid var(--border); border-radius: 8px; font-family: 'Cairo', sans-serif; font-size: 13px; color: var(--text); background: white; outline: none; }
  .form-group input:focus, .form-group select:focus { border-color: var(--green-mid); }
  .save-btn { background: var(--green); color: white; border: none; border-radius: 8px; padding: 10px 24px; font-family: 'Cairo', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer; }

  /* STATS */
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin-bottom: 20px; }
  .stat-box { background: white; border-radius: 12px; padding: 18px; box-shadow: var(--shadow); border: 1px solid var(--border); text-align: center; }
  .stat-num { font-size: 30px; font-weight: 700; color: var(--green); line-height: 1; }
  .stat-label { font-size: 12px; color: var(--text-muted); margin-top: 6px; }
  .progress-bar { height: 8px; border-radius: 4px; background: var(--green-pale); margin-top: 8px; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 4px; background: var(--green); }

  /* BIRTHDAYS */
  .month-title { font-size: 14px; font-weight: 700; color: var(--text-mid); margin-bottom: 10px; padding: 6px 14px; background: var(--green-faint); border-radius: 8px; display: inline-block; }
  .bday-item { display: flex; align-items: center; gap: 14px; padding: 10px 16px; background: white; border-radius: 10px; margin-bottom: 8px; border: 1px solid var(--border); box-shadow: var(--shadow); }
  .bday-avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--green-pale); display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; color: var(--green); flex-shrink: 0; }
  .bday-name { font-size: 14px; font-weight: 700; flex: 1; }
  .bday-date { font-size: 12px; color: var(--text-muted); }
  .bday-today { border-color: var(--amber); background: var(--amber-pale); }

  /* SYNC */
  .sync-indicator { position: fixed; bottom: 16px; left: 16px; background: var(--green); color: white; padding: 8px 16px; border-radius: 20px; font-size: 12px; font-weight: 600; display: none; z-index: 999; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
  .sync-indicator.error { background: var(--red); }

  /* ACTIVITIES */
  .activity-card { display: flex; align-items: center; gap: 16px; background: white; border-radius: 12px; padding: 16px 18px; margin-bottom: 12px; border: 1px solid var(--border); box-shadow: var(--shadow); }
  .activity-icon { width: 44px; height: 44px; border-radius: 10px; background: var(--green-pale); display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
  .activity-info { flex: 1; }
  .activity-name { font-size: 15px; font-weight: 700; }
  .activity-meta { font-size: 12px; color: var(--text-muted); margin-top: 3px; }
  .pdf-btn { background: var(--red-pale); color: var(--red); border: none; border-radius: 8px; padding: 8px 16px; font-family: 'Cairo', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }

  /* LEADER ATT */
  .leader-att-row { background: white; border-radius: 12px; padding: 14px 18px; margin-bottom: 10px; border: 1px solid var(--border); }
  .la-name { font-size: 14px; font-weight: 700; margin-bottom: 8px; }
  .la-controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .uniform-toggle { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-muted); }
  .uniform-toggle input { accent-color: var(--green); width: 16px; height: 16px; }

  @media (max-width: 600px) {
    .meeting-body { grid-template-columns: 1fr; }
    .form-row, .form-row.triple { grid-template-columns: 1fr; }
    .stats-grid { grid-template-columns: repeat(2,1fr); }
  }
</style>
</head>

// ===================== GOOGLE SHEETS SYNC =====================
async function syncToSheet(sheetName, rowData) {
  const indicator = document.getElementById("sync-indicator");
  indicator.textContent = "جاري الحفظ...";
  indicator.className = "sync-indicator";
  indicator.style.display = "block";
  try {
    const res = await fetch(APPS_SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ sheet: sheetName, row: rowData })
    });
    const text = await res.text();
    if (text === "ok" || res.ok) {
      indicator.textContent = "✓ تم الحفظ في الشيت";
      indicator.className = "sync-indicator";
      setTimeout(() => indicator.style.display = "none", 2000);
    } else {
      throw new Error(text);
    }
  } catch(e) {
    indicator.textContent = "⚠ تعذر الحفظ — تحقق من الاتصال";
    indicator.className = "sync-indicator error";
    setTimeout(() => indicator.style.display = "none", 3500);
  }
}

// ===================== LOGIN =====================
function selectRole(r) {
  currentRole = r;
  document.getElementById("role-leader").classList.toggle("active", r==="leader");
  document.getElementById("role-admin").classList.toggle("active", r==="admin");
  document.getElementById("leader-fields").style.display = r==="leader" ? "block" : "none";
  document.getElementById("admin-pass-field").style.display = r==="admin" ? "block" : "none";
}

document.getElementById("sel-class").addEventListener("change", function() {
  const cls = this.value;
  const sel = document.getElementById("sel-leader");
  sel.innerHTML = '<option value="">-- اختار --</option>';
  DATA.leaders.filter(l => l.class === cls || l.class === "كلا الفصلين").forEach(l => {
    sel.innerHTML += `<option value="${l.id}">${l.name}</option>`;
  });
  if (!DATA.leaders.length) {
    sel.innerHTML = '<option value="">لا يوجد قادة مسجلين بعد</option>';
  }
});

function doLogin() {
  const err = document.getElementById("login-error");
  err.style.display = "none";
  if (currentRole === "admin") {
    if (document.getElementById("admin-pass").value !== ADMIN_PASS) {
      err.textContent = "كلمة السر غلط"; err.style.display = "block"; return;
    }
    currentUser = { role:"admin", name:"قائد القطاع" };
  } else {
    const cls = document.getElementById("sel-class").value;
    const lid = document.getElementById("sel-leader").value;
    if (!cls || !lid) { err.textContent = "اختار الفصل والاسم"; err.style.display = "block"; return; }
    const leader = DATA.leaders.find(l => l.id == lid);
    if (!leader) { err.textContent = "القائد غير موجود"; err.style.display = "block"; return; }
    currentUser = { role:"leader", name:leader.name, id:leader.id, class:cls };
  }
  document.getElementById("screen-login").classList.remove("active");
  document.getElementById("screen-app").classList.add("active");
  initApp();
}

function doLogout() {
  currentUser = null;
  document.getElementById("screen-app").classList.remove("active");
  document.getElementById("screen-login").classList.add("active");
  document.getElementById("admin-pass").value = "";
}

// ===================== INIT =====================
function initApp() {
  document.getElementById("header-title").textContent = currentRole==="admin" ? "لوحة تحكم الأدمن — قطاع الملايكة" : "قطاع الملايكة";
  document.getElementById("header-sub").textContent = currentUser.name + (currentUser.class ? " — " + currentUser.class : "");
  if (currentRole === "admin") {
    document.getElementById("admin-tabs").style.display = "block";
    document.getElementById("leader-tabs").style.display = "none";
    checkBirthdays();
    renderAdminPlanMgmt(); renderAdminChildrenMgmt(); renderAdminLeadersMgmt();
    renderAdminLeadersAtt(); renderBirthdays(); renderReports();
  } else {
    document.getElementById("leader-tabs").style.display = "block";
    document.getElementById("admin-tabs").style.display = "none";
    renderPlan(); renderFollowup(); renderActivities(); renderAttendance();
  }
}

// ===================== TABS =====================
function showTab(name, role) {
  const prefix = role === "admin" ? "admin" : "leader";
  document.querySelectorAll(`#${prefix}-tabs .tab-content`).forEach(t => t.classList.remove("active"));
  document.querySelectorAll(`#${prefix}-tabs .tab-btn`).forEach(t => t.classList.remove("active"));
  document.getElementById("tab-" + name).classList.add("active");
  event.target.classList.add("active");
}

// ===================== HELPERS =====================
function leaderName(id) { const l = DATA.leaders.find(l=>l.id==id); return l ? l.name : "غير محدد"; }
function formatDate(d) {
  if (!d) return "—";
  const p = d.split("-"); if (p.length!==3) return d;
  return p[2]+"/"+p[1]+"/"+p[0];
}
const PARA_NAMES = { spiritual:"المحاضرة الروحية", scout:"المحاضرة الكشفية", culture:"المحاضرة الثقافية", game:"اللعبة" };
function leaderOptions() { return DATA.leaders.map(l=>`<option value="${l.id}">${l.name}</option>`).join(""); }

function renderPlan() {
  const c = document.getElementById("tab-plan");
  if (!DATA.meetings.length) { c.innerHTML = `<div class="card" style="text-align:center;color:var(--text-muted);padding:40px">لم تُضف اجتماعات بعد — الأدمن هيضيفها</div>`; return; }
  let html = `<h2 class="section-title">خطة اجتماعات السنة</h2>`;
  DATA.meetings.forEach(m => {
    html += `<div class="meeting-card"><div class="meeting-header"><span class="meeting-num">اجتماع ${m.num}</span><span class="meeting-date">${formatDate(m.date)}</span></div><div class="meeting-body">`;
    ["spiritual","scout","culture","game"].forEach(k => {
      const mine = m[k] == currentUser?.id;
      html += `<div class="para-item ${mine?"mine":""}"><div class="para-label">${PARA_NAMES[k]}</div><div class="para-leader">${leaderName(m[k])}${mine?" ⭐":""}</div></div>`;
    });
    html += `</div></div>`;
  });
  c.innerHTML = html;
}

    <div class="form-row"><div class="form-group"><label>الثقافية</label><select id="nm-cu">${lo}</select></div><div class="form-group"><label>اللعبة</label><select id="nm-gm">${lo}</select></div></div>
    <button class="save-btn" onclick="addMeeting()">حفظ</button>
  </div>`;
  if (DATA.meetings.length) {
    html += `<div class="table-wrap"><table><thead><tr><th>#</th><th>التاريخ</th><th>الروحية</th><th>الكشفية</th><th>الثقافية</th><th>اللعبة</th><th></th></tr></thead><tbody>`;
    DATA.meetings.forEach(m => {
      html += `<tr><td><b>${m.num}</b></td><td>${formatDate(m.date)}</td><td>${leaderName(m.spiritual)}</td><td>${leaderName(m.scout)}</td><td>${leaderName(m.culture)}</td><td>${leaderName(m.game)}</td><td><button class="act-btn act-btn-red" onclick="deleteMeeting(${m.id})">حذف</button></td></tr>`;
    });
    html += `</tbody></table></div>`;
  }
  html += `<h2 class="section-title" style="margin-top:28px">الأنشطة السنوية</h2>
  <div class="add-form"><h3>إضافة نشاط</h3>
    <div class="form-row"><div class="form-group"><label>الاسم</label><input type="text" id="na-name" placeholder="اسم النشاط"></div><div class="form-group"><label>التاريخ</label><input type="date" id="na-date"></div></div>
    <div class="form-row"><div class="form-group"><label>القائد المسئول</label><select id="na-ldr">${lo}</select></div></div>
    <button class="save-btn" onclick="addActivity()">حفظ</button>
  </div>`;
  DATA.activities.forEach(a => {
    html += `<div class="activity-card"><div class="activity-icon">⛺</div><div class="activity-info"><div class="activity-name">${a.name}</div><div class="activity-meta">📅 ${formatDate(a.date)} | ${leaderName(a.leader_id)}</div></div><button class="act-btn act-btn-red" onclick="deleteActivity(${a.id})">حذف</button></div>`;
  });
  c.innerHTML = html;
}
function addMeeting() {
  const date=document.getElementById("nm-date").value, num=document.getElementById("nm-num").value;
  if (!date||!num){alert("ادخل التاريخ والرقم");return;}
  const id=Math.max(...DATA.meetings.map(m=>m.id),0)+1;
  DATA.meetings.push({id,date,num:parseInt(num),spiritual:parseInt(document.getElementById("nm-sp").value),scout:parseInt(document.getElementById("nm-sc").value),culture:parseInt(document.getElementById("nm-cu").value),game:parseInt(document.getElementById("nm-gm").value)});
  renderAdminPlanMgmt(); renderPlan && renderPlan();
  syncToSheet("خطة الاجتماعات",[`اجتماع ${num}`,date,leaderName(parseInt(document.getElementById("nm-sp").value)),leaderName(parseInt(document.getElementById("nm-sc").value)),leaderName(parseInt(document.getElementById("nm-cu").value)),leaderName(parseInt(document.getElementById("nm-gm").value))]);
}
function deleteMeeting(id){if(!confirm("حذف؟"))return;DATA.meetings=DATA.meetings.filter(m=>m.id!==id);renderAdminPlanMgmt();}
function addActivity(){
  const name=document.getElementById("na-name").value,date=document.getElementById("na-date").value;
  if(!name||!date){alert("ادخل الاسم والتاريخ");return;}
  const id=Math.max(...DATA.activities.map(a=>a.id),0)+1;
  DATA.activities.push({id,name,date,leader_id:parseInt(document.getElementById("na-ldr").value)});
  renderAdminPlanMgmt();
}
function deleteActivity(id){if(!confirm("حذف؟"))return;DATA.activities=DATA.activities.filter(a=>a.id!==id);renderAdminPlanMgmt();}

// ===================== ADMIN: CHILDREN =====================
function renderAdminChildrenMgmt() {
  const c = document.getElementById("tab-children-mgmt");
  const lo = leaderOptions()||'<option value="">لا يوجد قادة</option>';
  const classOpts = `<option value="ملايكة أ">ملايكة أ</option><option value="ملايكة ب">ملايكة ب</option>`;
  let html = `<h2 class="section-title">إدارة الأولاد <span class="badge badge-green">${DATA.children.length} طفل</span></h2>
  <div class="add-form"><h3>إضافة طفل</h3>
    <div class="form-row"><div class="form-group"><label>الاسم</label><input type="text" id="nc-name"></div><div class="form-group"><label>التليفون</label><input type="text" id="nc-phone"></div></div>
    <div class="form-row"><div class="form-group"><label>العنوان</label><input type="text" id="nc-addr"></div><div class="form-group"><label>تاريخ الميلاد</label><input type="date" id="nc-dob"></div></div>
    <div class="form-row"><div class="form-group"><label>الفصل</label><select id="nc-cls">${classOpts}</select></div><div class="form-group"><label>القائد</label><select id="nc-ldr">${lo}</select></div></div>
    <button class="save-btn" onclick="addChild()">إضافة</button>
  </div>
  <div class="table-wrap"><table><thead><tr><th>الاسم</th><th>الفصل</th><th>القائد</th><th>التليفون</th><th>الميلاد</th><th></th></tr></thead><tbody>`;
  DATA.children.forEach(ch => {
    html += `<tr><td><b>${ch.name}</b></td><td>${ch.class}</td><td>${leaderName(ch.leader_id)}</td><td>${ch.phone||"—"}</td><td>${formatDate(ch.dob)}</td><td><button class="act-btn act-btn-green" onclick="assignLeader(${ch.id})">تعيين قائد</button></td></tr>`;
  });
  html += `</tbody></table></div>`;
  c.innerHTML = html;
}
function addChild(){
  const name=document.getElementById("nc-name").value;
  if(!name){alert("ادخل الاسم");return;}
  const id=Math.max(...DATA.children.map(c=>c.id),0)+1;
  DATA.children.push({id,name,phone:document.getElementById("nc-phone").value,address:document.getElementById("nc-addr").value,dob:document.getElementById("nc-dob").value,class:document.getElementById("nc-cls").value,leader_id:parseInt(document.getElementById("nc-ldr").value)});
  renderAdminChildrenMgmt();
  syncToSheet("الأولاد",[name,document.getElementById("nc-cls").value,leaderName(parseInt(document.getElementById("nc-ldr").value)),document.getElementById("nc-phone").value,document.getElementById("nc-addr").value,document.getElementById("nc-dob").value]);
}
function assignLeader(cid){
  if(!DATA.leaders.length){alert("أضف قادة أولاً");return;}
  const opts = DATA.leaders.map(l=>`${l.id}:${l.name}`).join("\n");
  const lid = prompt(`اختار رقم القائد:\n${DATA.leaders.map((l,i)=>`${l.id}. ${l.name}`).join("\n")}`);
  if(lid && DATA.leaders.find(l=>l.id==lid)){DATA.children.find(c=>c.id===cid).leader_id=parseInt(lid);renderAdminChildrenMgmt();}
}

// ===================== ADMIN: LEADERS =====================
function renderAdminLeadersMgmt() {
  const c = document.getElementById("tab-leaders-mgmt");
  const classOpts = `<option value="ملايكة أ">ملايكة أ</option><option value="ملايكة ب">ملايكة ب</option><option value="كلا الفصلين">كلا الفصلين</option>`;
  let html = `<h2 class="section-title">إدارة القادة <span class="badge badge-green">${DATA.leaders.length} قائد</span></h2>
  <div class="add-form"><h3>إضافة قائد</h3>
    <div class="form-row"><div class="form-group"><label>الاسم</label><input type="text" id="nl-name"></div><div class="form-group"><label>رقم الموبايل</label><input type="text" id="nl-phone"></div></div>
    <div class="form-row"><div class="form-group"><label>تاريخ الميلاد</label><input type="date" id="nl-dob"></div><div class="form-group"><label>الفصل</label><select id="nl-cls">${classOpts}</select></div></div>
    <button class="save-btn" onclick="addLeader()">إضافة</button>
  </div>`;
  if(DATA.leaders.length) {
    html += `<div class="table-wrap"><table><thead><tr><th>الاسم</th><th>الفصل</th><th>الموبايل</th><th>تاريخ الميلاد</th><th></th></tr></thead><tbody>`;
    DATA.leaders.forEach(l=>{
      html+=`<tr><td><b>${l.name}</b></td><td>${l.class}</td><td>${l.phone||"—"}</td><td>${formatDate(l.dob)}</td><td><button class="act-btn act-btn-red" onclick="deleteLeader(${l.id})">حذف</button></td></tr>`;
    });
    html+=`</tbody></table></div>`;
  } else {
    html += `<div class="card" style="text-align:center;color:var(--text-muted);padding:30px">لم يُضف قادة بعد — ابدأ بإضافة أول قائد</div>`;
  }
  c.innerHTML = html;
}
function addLeader(){
  const name=document.getElementById("nl-name").value;
  if(!name){alert("ادخل الاسم");return;}
  const id=Math.max(...DATA.leaders.map(l=>l.id),0)+1;
  const newL={id,name,phone:document.getElementById("nl-phone").value,dob:document.getElementById("nl-dob").value,class:document.getElementById("nl-cls").value};
  DATA.leaders.push(newL);
  renderAdminLeadersMgmt();
  syncToSheet("القادة",[name,newL.class,newL.phone,newL.dob]);
}
function deleteLeader(id){if(!confirm("حذف القائد؟"))return;DATA.leaders=DATA.leaders.filter(l=>l.id!==id);renderAdminLeadersMgmt();}

// ===================== ADMIN: LEADERS ATTENDANCE =====================
function renderAdminLeadersAtt() {
  const c = document.getElementById("tab-leaders-att");
  const meetOpts = DATA.meetings.map(m=>`<option value="${m.id}">اجتماع ${m.num} — ${formatDate(m.date)}</option>`).join("");
  const lastM = DATA.meetings[DATA.meetings.length-1];
  let html = `<h2 class="section-title">حضور القادة</h2>
  <div class="card" style="margin-bottom:16px"><label style="font-size:13px;font-weight:600;color:var(--text-mid);margin-bottom:6px;display:block">الاجتماع:</label>
  <select class="login-select" style="margin-bottom:0" id="la-meet-sel">${meetOpts||'<option>لا توجد اجتماعات</option>'}</select></div>`;
  if(!DATA.leaders.length){ html+=`<div class="card" style="text-align:center;color:var(--text-muted);padding:30px">لم يُضف قادة بعد</div>`; }
  DATA.leaders.forEach(l => {
    const mid=lastM?.id||0, key=`la_${mid}_${l.id}`, status=DATA.leader_attendance[key]||"", uniform=DATA.leader_attendance[key+"_u"]||false;
    html+=`<div class="leader-att-row">
      <div class="la-name">${l.name} <span style="font-size:12px;color:var(--text-muted)">${l.class}</span></div>
      <div class="la-controls">
        <button class="status-btn ${status==="present"?"s-present":""}" onclick="setLeaderAtt('${key}',${l.id},'present',this)">حضر ✓</button>
        <button class="status-btn ${status==="excused"?"s-excused":""}" onclick="setLeaderAtt('${key}',${l.id},'excused',this)">بعذر</button>
        <button class="status-btn ${status==="absent"?"s-absent":""}" onclick="setLeaderAtt('${key}',${l.id},'absent',this)">بدون عذر</button>
        <label class="uniform-toggle"><input type="checkbox" ${uniform?"checked":""} onchange="DATA.leader_attendance['${key}_u']=this.checked"> بزي كشفي</label>
      </div>
      <textarea class="notes-input" style="margin-top:8px" placeholder="ملاحظات..." onchange="DATA.leader_attendance['${key}_note']=this.value"></textarea>
    </div>`;
  });
  c.innerHTML = html;
}
function setLeaderAtt(key,lid,status,btn){
  DATA.leader_attendance[key]=status;
  btn.closest(".leader-att-row").querySelectorAll(".status-btn").forEach(b=>b.className="status-btn");
  const cls={present:"s-present",excused:"s-excused",absent:"s-absent"};
  btn.classList.add(cls[status]);
  const l=DATA.leaders.find(l=>l.id===lid);
  const labels={present:"حضر",excused:"بعذر",absent:"بدون عذر"};
  syncToSheet("حضور القادة",[new Date().toLocaleDateString("ar-EG"),l?.name||lid,labels[status]||status,DATA.leader_attendance[key+"_u"]?"بزي":"بدون زي",DATA.leader_attendance[key+"_note"]||""]);
}

// ===================== BIRTHDAYS =====================
function checkBirthdays(){
  const today=new Date(), mm=String(today.getMonth()+1).padStart(2,'0'), dd=String(today.getDate()).padStart(2,'0');
  const b=DATA.leaders.find(l=>l.dob&&l.dob.slice(5)===`${mm}-${dd}`);
  if(b){document.getElementById("bday-name-banner").textContent=b.name;document.getElementById("birthday-banner").style.display="block";}
}
function renderBirthdays(){
  const c=document.getElementById("tab-birthdays");
  const today=new Date(), mm=String(today.getMonth()+1).padStart(2,'0'), dd=String(today.getDate()).padStart(2,'0');
  const months=["يناير","فبراير","مارس","إبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
  let byMonth={};
  DATA.leaders.forEach(l=>{if(!l.dob)return;const m=parseInt(l.dob.split("-")[1])-1;if(!byMonth[m])byMonth[m]=[];byMonth[m].push(l);});
  let html=`<h2 class="section-title">أعياد ميلاد القادة</h2>`;
  if(!DATA.leaders.length){html+=`<div class="card" style="text-align:center;color:var(--text-muted);padding:30px">لم يُضف قادة بعد</div>`;c.innerHTML=html;return;}
  for(let i=0;i<12;i++){
    if(!byMonth[i])continue;
    html+=`<div style="margin-bottom:20px"><div class="month-title">🗓 ${months[i]}</div>`;
    byMonth[i].forEach(l=>{
      const isToday=l.dob&&l.dob.slice(5)===`${mm}-${dd}`;
      html+=`<div class="bday-item ${isToday?"bday-today":""}"><div class="bday-avatar">${l.name[0]}</div><div class="bday-name">${l.name}${isToday?" 🎂":""}</div><div class="bday-date">${formatDate(l.dob)}</div><span class="badge ${isToday?"badge-amber":"badge-green"}">${isToday?"اليوم!":l.class}</span></div>`;
    });
    html+=`</div>`;
  }
  c.innerHTML=html;
}

// ===================== REPORTS =====================
function renderReports(){
  const c=document.getElementById("tab-reports");
  const followed=DATA.children.filter(ch=>DATA.followup["f_"+ch.id]==="done").length;
  const total=DATA.children.length;
  const pct=total?Math.round(followed/total*100):0;
  const lastM=DATA.meetings[DATA.meetings.length-1];
  let present=0,excused=0,absent=0;
  DATA.children.forEach(ch=>{const s=DATA.attendance[`att_${lastM?.id||0}_${ch.id}`];if(s==="present")present++;else if(s==="excused")excused++;else if(s==="absent")absent++;});
  let html=`<h2 class="section-title">تقارير القطاع</h2>
  <div class="stats-grid">
    <div class="stat-box"><div class="stat-num">${total}</div><div class="stat-label">إجمالي الأولاد</div></div>
    <div class="stat-box"><div class="stat-num">${followed}/${total}</div><div class="stat-label">تم افتقادهم</div><div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div></div>
    <div class="stat-box"><div class="stat-num" style="color:var(--green)">${present}</div><div class="stat-label">حضروا (آخر اجتماع)</div></div>
    <div class="stat-box"><div class="stat-num" style="color:var(--amber)">${excused}</div><div class="stat-label">غياب بعذر</div></div>
    <div class="stat-box"><div class="stat-num" style="color:var(--red)">${absent}</div><div class="stat-label">بدون عذر</div></div>
    <div class="stat-box"><div class="stat-num">${DATA.leaders.length}</div><div class="stat-label">القادة</div></div>
  </div>`;
  // Per leader
  if(DATA.leaders.length){
    html+=`<div class="card"><div class="card-title" style="font-size:15px;font-weight:700;margin-bottom:14px">افتقاد كل قائد</div><div class="table-wrap"><table><thead><tr><th>القائد</th><th>الفصل</th><th>الأولاد</th><th>تم</th><th>النسبة</th></tr></thead><tbody>`;
    DATA.leaders.forEach(l=>{
      const kids=DATA.children.filter(c=>c.leader_id==l.id);
      const done=kids.filter(c=>DATA.followup["f_"+c.id]==="done").length;
      const p=kids.length?Math.round(done/kids.length*100):0;
      html+=`<tr><td><b>${l.name}</b></td><td>${l.class}</td><td>${kids.length}</td><td>${done}</td><td><div style="display:flex;align-items:center;gap:8px"><div class="progress-bar" style="flex:1;min-width:60px"><div class="progress-fill" style="width:${p}%"></div></div><span style="font-size:12px;font-weight:700;color:var(--green)">${p}%</span></div></td></tr>`;
    });
    html+=`</tbody></table></div></div>`;
  }
  // Children list
  html+=`<div class="card" style="margin-top:16px"><div style="font-size:15px;font-weight:700;margin-bottom:14px">حضور الأولاد — آخر اجتماع</div><div class="table-wrap"><table><thead><tr><th>الطفل</th><th>الفصل</th><th>القائد</th><th>الحالة</th></tr></thead><tbody>`;
  DATA.children.forEach(ch=>{
    const s=DATA.attendance[`att_${lastM?.id||0}_${ch.id}`]||"—";
    const labels={present:"حضر",excused:"غياب بعذر",absent:"بدون عذر","—":"—"};
    const badges={present:"badge-green",excused:"badge-amber",absent:"badge-red","—":""};
    html+=`<tr><td><b>${ch.name}</b></td><td>${ch.class}</td><td>${leaderName(ch.leader_id)}</td><td><span class="badge ${badges[s]}">${labels[s]}</span></td></tr>`;
  });
  html+=`</tbody></table></div></div>`;
  c.innerHTML=html;
}
</script>
</body>
</html>
